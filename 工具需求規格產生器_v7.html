<!DOCTYPE html>
<!--
================================================================
工具需求規格產生器｜開發紀錄（給後續 AI 助手／維護者先讀這一段）
現行版本：v07（2026-11-04）
改版必做：版號多處一起改——①檔名 ②<title> ③畫面 h1 的 #ver ④程式 const VER ⑤檔案最上方「版本紀錄」註解 ⑥本註解。
================================================================
【用途】把已經做好的單檔 HTML 工具，拆成「匯入 → 讀取原始資料 → 解析與清洗 → 篩選 → 排版 → 匯出」六個階段的功能模組，讓使用者勾選、補充指定，輸出下一支工具的開發需求書。
【結構】單檔、純前端、不連網、不依賴任何外部程式庫（所以沒有 cdnjs 問題）。三個分頁：①解析現有工具（內建十四支工具的白話解析＋上傳 HTML 自動偵測＋功能對照表）②指定需求（基本資料、資料來源、六階段勾選、業務規則／口徑／輸出欄位）③產出需求書（Markdown，可複製、下載、存成 JSON 再載入）。
【功能目錄 CAT】每個模組有 id、階段 st、來源 src（p＝打卡異常檢核工具 V70、x＝全聯18天銷售分析工具 v39、q＝問卷照片檢視工具 v193、s＝督導管理系統 執行追蹤儀表板 v390、r＝patrol_board 節慶巡補看板 1.55.1、v＝coverage_board 覆蓋率看板 3.17.0；v05 起 p／x／q／s 依序升為 V115／v79／v196／v505，另加 c＝CVS菸品獎勵計算表 V34、h＝人力調查表編輯工具 v43、a＝店家分配試算工具 V11、d＝原始檔案去識別化工具 V23、g＝原始檔案虛擬生產器 V10、o＝缺貨通報分析工具 v9、w＝勞逸比估算工具 v5、l＝報表連結分段工具 v49，是人工讀程式後標的）、做法 how、踩坑 pit、參考函式 ref、偵測規則 det（正規表示式）。新增模組只要在 CAT 加一筆；det 沒寫就不會被自動偵測，但仍可手動勾選。
【自動偵測 analyzeHtml】先把 <script src> 外連與內嵌大型程式庫（開頭是授權橫幅、超過 30KB）切出去，只對「工具自己的程式與 HTML」套 det；偵測前先去掉 HTML 註解與 /*…*/ 註解，避免開發紀錄裡提到的字被算進去。偵測結果是字串特徵推測，不是語意分析，畫面上已標示「請人工確認」。
【驗證方式】用 node 載入 CORE 區塊，對原始檔跑 analyzeHtml，逐項比對 src 與偵測結果；v02 只拿到 q、s 兩支原始檔，p、x 的對照仍是 v01 的結論（v02 改動的四條 det 沒有用 p、x 原檔重跑，下次拿到原檔要補驗）；v02 對 q、s 跑出的結果已逐項比對 src；沒有特徵可偵測的項目（單檔 HTML、名詞對照表等）以人工標註為準。改 CAT 或 det 後要重跑。
【踩過的坑】
  - 打卡工具的開發紀錄註解裡寫了 haversine，實際程式用的是 Math.asin(Math.sqrt()) 與 12742000；det 以程式為準。
  - 打卡工具的 .seg 是匯出對話框的格式選擇，不是篩選；d_chips 只認 class="chips"。
  - 打卡工具的 type="date" 在「下載區間」對話框，不是資料篩選；d_date 改認 mFrom／cutoff／ytd。
  - 18天工具沒有說明書、沒有檔頭開發紀錄；z_manual、z_notes 只標 p。
  - 問卷工具的 window.open('') 是開列印視窗不是下載捷徑；classifyDupPair 是重複照片分類不是檔案辨識；JSZip 用在讀 xlsx 不是匯出 ZIP；toISOString().slice(0,10) 不是表頭列偵測——這四條 det 已收緊；另外 analyzeHtml 去註解的方式改成只剝「前面是空白或符號」的 /*…*/ 與 // 行註解（舊寫法遇到字串裡的 /* 會把一大段程式吃掉，造成 PptxGenJS 這類真的存在的做法偵測不到、也讓註解裡的 window.open() 被算進去）。
  - 督導工具靠「檔名」分流、不靠表頭；它的 showDirectoryPicker 是「依營業處拆分來源檔」小工具用的，不是記住資料夾；DecompressionStream 是還原靜態副本用的，不是讀 .gz。
  - r、v 兩支都依賴同資料夾的 shared/*.js 與 shared/dashboard-common.css，這些檔案沒有拿到，所以它們「匯出、照片牆、逐題彙整、彙整看板」的實作細節只能依主檔裡的呼叫與說明推測，標在對照表上的 ✓ 只代表主檔有用到。
  - r、v 的 d_keep 偵測會誤中（localStorage 只用在登入檢查），src 不標。
【v04 白話層】WQ（問答選項）→ 對應模組 id 清單 → wzApply() 只改動「WQ 有涉及的模組」的勾選，不動其他模組的手動勾選。新增白話選項只要在 WQ 加一筆 [id,標題,說明,例子,[模組id]]。WINTRO 是各支工具的一句話介紹。wzFromTool 以「該選項的模組有一半以上屬於某工具」推算套用，不需另外維護。白話文字不放函式名稱與技術名詞。
【v05 解析紀錄】
  - 十二支原始檔都拿到了（巡補、覆蓋率兩支看板沒有新檔，維持 v03 的結論）。做法：讀檔頭開發紀錄／畫面內開發日誌／程式，把「新功能」拆成元件放進 CAT，再用 node 對十二支原檔跑 analyzeHtml，逐項比對偵測結果與 src。
  - 舊模組的 src 對 p／x／q／s 只「加」不「減」：v01～v03 對舊版本的結論保留；新版本新增的做法另立新模組（例：z_update、z_deid、c_cut、f_styled）。
  - 偵測收緊：d_keep 原本認 localStorage，但十支工具都把「檢查更新」的暫存放 localStorage，全部誤中 → 改只認 kvSet('scope…；e_map 原本認任何 Leaflet 字樣，打卡工具的說明文字「Leaflet 載不進來」會誤中 → 改認 L.map( 或 leaflet.js／.css；b_photo 原本認 xl/drawings，18天工具匯出原生圖表也寫 drawings → 改只認 xl/media。
  - 已知偵測限制（src 以人工為準）：報表連結工具的下載器程式放在 <script type="text/plain"> 範本裡，analyzeHtml 會把它當內嵌資料跳過，所以 f_copy 以外的下載器功能偵測不到；18天工具的 ExcelJS／JSZip 壓縮內嵌，程式庫清單看不到它們；缺貨與 18天工具內嵌了完整 SheetJS，SheetJS 本身的字串（例：opendocument）已被 splitCode 切掉、不會誤中。
  - 沒有特徵可偵測的新模組（z_rulesrc、z_nogray、c_onemetric、d_dims、f_diag、a_zip）以人工標註為準。
【v07 整合層】
  - ALIAS：被合併的舊模組 id → 新 id（f_line→f_copy、c_latest／c_visit→c_dedupe、a_fshandle→a_drag、a_folderguard→a_folder）；讀瀏覽器暫存與 .json 存檔時自動轉換。之後再合併模組，一律在這裡加對應，不要直接刪 id。
  - NEED：勾了某模組就必須一起有的模組（needClosure 遞迴展開，勾選與白話問答都會自動補勾）。REL：常一起用，只提示不自動勾。需求書每個模組下會列「需要搭配」與「可考慮一起用（本次未選）」。
  - 新增模組時：能和既有模組合併的先合併（在 how 裡寫「其他做法」並補 src、ref），真的是不同功能才新增；並補 NEED／REL。
  - 覆蓋率檢查：把督導儀表板依 @@模組 標籤分段，檢查每段至少有一個函式出現在某模組的 ref／how／pit；v07 結果 50 段全數對到。其他工具以函式清單人工逐一判斷（內部小函式不另立模組）。
【未決／可做】上傳 JSON（存檔）時尚未檢查版本相容；可考慮加「從需求書反推缺少的模組」。
================================================================
-->
<html lang="zh-Hant"><head><meta charset="utf-8">

<title>工具需求規格產生器 v07</title>
<style>

 ref:{p:'xPdf()／xDraw()／planPages()／xPdfBuild()',h:'buildPdf()',x:'exportPdf()'},det:/xPdfBuild|%PDF|jsPDF|window\.print\(/},
{id:'f_zip',st:'f',src:'psdgq',label:'多份報告打包 ZIP（一處一份、一所一份、一人一份）',
 how:'JSZip 把每份檔案放進去，最後一個 ZIP 下載；份數超過一份才需要。另一種交付方式（問卷工具）：一處一份／一所一份／一人一份時，各開一個新分頁產生報告，讓使用者逐份列印或存檔。',
 pit:'JSZip 沒載入要提示請連網，不要讓按鈕靜默失敗。',ref:{p:'xGo()'},det:/generateAsync\(\s*\{\s*type\s*:\s*['"](?:blob|uint8array|base64)['"]/},
{id:'f_dialog',st:'f',src:'pqs',label:'匯出對話框：格式、份數、排序、異常類型、對象樹、統計列',
 how:'①格式（PDF／靜態HTML／Excel）②份數（整份／一處／一所／一人一份）③排序 ④樣態（預設帶入畫面已選 KPI，沒選＝全選）⑤對象樹 ⑥統計列與「匯出」。對象樹不受畫面篩選影響；篩完沒有筆數的對象不產生報告。',
 ref:{p:'xRender()／xGroups()／xBuild()／xSumCmp()'},det:/xGroups|xBuild\s*\(|xSumCmp/},
{id:'f_shot',st:'f',src:'pxsrv',label:'畫面截圖（下載 PNG 或複製到剪貼簿）',
 how:'html2canvas 擷取主畫面；不想入鏡的元素加 data-shot-skip。進階：可「框選截圖」只拍某一塊；截圖前展開捲動區、收起彈出選單、等地圖穩定；複製到剪貼簿失敗時改下載 PNG。',
 pit:'主畫面 CSS 不可用 color-mix()／color()（html2canvas 1.4.1 不支援）；沒載入 html2canvas 要提示。Leaflet 地圖的 SVG 圖層拍不到，連線要改 Canvas 繪製；底圖跨網域會污染畫布，重試時只排除底圖圖磚。',
 ref:{p:'shot()',x:'截圖複製剪貼簿（v37）',s:'captureCurrentView()／_expandScrollables()',x:'框選截圖 startRegion()'},det:/html2canvas\s*\(|ClipboardItem/},
{id:'f_snap',st:'f',src:'xqscho',label:'靜態副本：把整個網頁連同資料存成一個可離線開的 HTML',
 how:'啟動時先記下 document.documentElement.outerHTML；匯出時把資料 gzip＋base64 塞進 <script type="text/plain" id="embdata">，開啟副本時偵測到就改走唯讀模式。其他做法：CVS 工具在頁面載入時記下尚未放資料的骨架（TEMPLATE_HTML），快照把資料以 <script type="application/json"> 內嵌、連規則組一起帶走；缺貨工具的快照內嵌一份凍結明細，離線也能點數字看店家；人力工具的快照開啟後另存一組本機暫存，不會覆蓋原工具的資料。含照片的快照：畫面上的照片多是暫時網址（blob），存檔前要先轉成內嵌資料，否則開啟快照時照片全破圖。',
 pit:'base64 一定要先轉（v23 漏了，副本整頁空白）；標題與檔名帶存檔時間，同一天多份才不會混淆。快照會越來越大：儀表板的做法是去掉程式註解、資料改成「欄位字典＋整欄」編碼、能算回來的欄位不存（約 2.5MB→1.7MB），並在格式裡帶版本號。',
 ref:{x:'exportSnapshot()／loadEmbedded()／SRC0',c:'saveSnapshot()／restoreSnapshot()',s:'svSnapEncode()／svCreateSnapshotHtmlBuilder()／restoreFromSnapshot()',o:'exportSnap()'},det:/embdata|exportSnapshot/},
{id:'f_name',st:'f',src:'pxqschadgowl',label:'檔名規則：名稱＋版號＋區間＋對象＋時間',
 how:'例：打卡異常報告_V70_20260901-0930_北部.pdf；非法字元清掉；Blob＋<a download>＋revokeObjectURL 下載。',
 ref:{p:'xFile()／xSafe()／xSave()',x:'download()'},det:/\.download\s*=|\bdownload\s*\(/},
/* ---- v02 新增：問卷照片檢視工具 v193（q）與督導管理系統 v390（s） ---- */
{id:'z_terms',st:'z',src:'s',label:'名詞對照表：畫面上同一件事全站只有一個名稱',
 how:'維護一張「現行名稱／舊稱」對照表；新增或改名任何按鈕、欄名、提示前先查表；改完用舊稱全文掃描，結果必須 0 筆。圖示全站不重複。督導儀表板 另規定禁灰色系字體、日期一律新到舊。',
 pit:'來源檔的欄名、匯出與外部試算表對齊的欄名可刻意保留原樣，要在表上註明。',ref:{s:'說明書「名詞與畫面對照」章'}},
{id:'z_modules',st:'z',src:'s',label:'程式碼模組標籤＋說明書分章（讓下一位 AI 能快速找到程式）',
 how:'每個功能區塊上方放「// @@模組：名稱」；說明書分章（版號、工作原則、功能用途、技術備忘、現行設計、版本對照、名詞、畫面對照、專案地圖、驗證手冊、待辦）。',
 pit:'行號會漂移，找程式一律用文字錨點 grep。章節字母與備忘編號一旦被程式註解引用就不可重編。',ref:{s:'說明書「找程式與驗證」章'},det:/@@模組/},
{id:'z_verify',st:'z',src:'qscadg',label:'驗證手冊：優化、刪除、合併前後必須「逐項相同」，交付說明分「已驗證／未驗證」',
 how:'用自動化瀏覽器（Playwright／headless Chrome）載入測試資料，依序開各畫面，取文字＋尺寸＋計算樣式前後比對；純函式用隨機輸入比對新舊輸出。沒做的測試不可寫成做過。',
 pit:'比對前要關動畫、去掉時間字串與版號；真實印表機、Firefox、Safari、真實手機通常驗不到，要老實列在「未驗證」。',ref:{s:'說明書「找程式與驗證」章'}},
{id:'a_byname',st:'a',src:'s',label:'依「檔名」分流來源檔（檔名含關鍵字、或以某字開頭）',
 how:'逐檔看檔名：含「工作管理」「客戶資料」「打卡異常」；開頭為 cardtime、attendance；另有專屬檔名的業績檔。只收 csv／xlsx／xls，略過 ~$ 暫存檔；一個都對不上就整批中止並告訴使用者要什麼檔名。',
 pit:'與「依表頭辨識」是兩種流派：檔名快但使用者一改名就失效。SAP 匯出常是 UTF-16 文字檔卻叫 .xls，所以解析時還要另外判斷真實格式。',ref:{s:'processFiles()'},det:/\.name\.includes\(\s*["'][\u4e00-\u9fff]/},
{id:'a_period',st:'a',src:'s',label:'資料所屬年月讀資料夾名（YYYYMM）；選填來源檔須與主檔同一次拖入',
 how:'年月優先取資料夾名，抓不到才退回檔名猜；選填檔（打卡異常、刷卡、請假）要和主檔一起拖，因為每次匯入先清空全部資料。',
 pit:'檔名數字常是匯出時間戳，會與資料夾月份對不上；沒有「事後補拖」，單獨拖選填檔要擋下並提示。',ref:{s:'getFolderYearMonth()／resetApp()'},det:/getFolderYearMonth/},
{id:'b_header2',st:'b',src:'qcod',label:'雙層標題列攤平成單列欄名',
 how:'第一列是大題、第二列是小題時，兩列合併成一個欄名，之後仍依欄名取欄。',ref:{q:'攤平雙列標題()'},det:/攤平雙列標題/},
{id:'b_photo',st:'b',src:'qcd',label:'取出 xlsx 儲存格內嵌的照片，依圖片所在列比對到那一筆資料',
 how:'xlsx 其實是壓縮包：用 JSZip 打開，讀 xl/drawings（圖片貼在哪一列）與 xl/media（圖片本體），再依列號比對到資料列。',
 pit:'只適用「插入圖片→置於儲存格內」；SheetJS 讀不到圖片，必須另用 JSZip。',ref:{q:'extractPhotosFromXlsx()'},det:/xl\/media/},
{id:'b_zlite',st:'b',src:'q',label:'大 xlsx 先瘦身再讀（拿掉圖片等大塊內容再交給 SheetJS）',
 how:'用 JSZip 重新打包一份不含圖片的精簡 zip，只讀資料；圖片另外處理。失敗時退回整檔讀取，只是比較慢。',ref:{q:'buildLiteZipBuffer()'},det:/buildLiteZipBuffer|liteZip/},
{id:'b_worker',st:'b',src:'qxs',label:'背景執行緒（Web Worker）平行運算（解析 xlsx、算照片特徵碼），單檔、不另放 .js',
 how:'Worker 程式碼放 <script type="text/plain">，用時讀 textContent、包成 Blob 開 Worker；先抽樣讓主執行緒與 worker 各算一次比對，對不上就整個退回主執行緒；單筆逾時 30 秒也退回。其他：18天工具先建「背景引擎」，建不起來就改用主執行緒引擎（同一套介面）；儀表板讀 xlsx 也走 Worker。',
 pit:'Worker 沒有 DOM、拿不到全域變數，同一段演算法會有兩份要一起維護；file:// 下少數環境會擋 blob Worker，一定要有退路。',ref:{q:'checkWorkerSupport()／getParseWorkerSrcUrl()',x:'makeWorkerEngine()／makeLocalEngine()',s:'svXlsxWorkerParse()'},det:/new\s+Worker\(/},
{id:'c_photomatch',st:'c',src:'q',label:'照片比對到資料列：店家與人員完全吻合＋日期分層比對（不容許天數誤差）',
 how:'先要求「店家型態＋店家＋業務員」前綴完全吻合；再比日期，依序用打卡時間→回報時間→月份，每一層都要求日期逐字相同；月份欄只在前兩層都缺值才用，並提示使用者精度較低。',
 pit:'同店高頻回訪（最短隔 2 天）若容許 ±N 天誤差，同一張照片會同時落進兩次回訪。',ref:{q:'matchAndAttachPhotos()／buildRowPrefixes()'},det:/matchAndAttachPhotos|buildRowPrefixes/},
{id:'c_dupphoto',st:'c',src:'q',label:'重複／相似照片檢測（影像特徵碼→配對複驗→分群→類型與判定依據）',
 how:'每張照片縮圖算簽章（dHash、灰階相關、色彩差）→ 用分段索引列舉候選配對 → 對齊複驗 → 分群。樣態：跨店異日／跨店同日／同店異日；判定依據：完全重複／裁切縮放／疑似同場景（拿不準降級成疑似，請人工確認，也可標記誤判並排除、可復原）。報告措辭可切換：預設中性描述，必要時才打開較明確的指認語氣；開始掃描前先讓使用者勾選要比對的題目並確認範圍。',
 pit:'浮水印不可當「不同次拍攝」的證據；邊緣案例別用放寬門檻去救，交給「疑似＋人工確認」；手機畫面截圖（高寬比>2）會被特徵比對誤認；簽章計算不平行，7 萬張約要 5 分鐘。',ref:{q:'dupSignatureFromPixels()／classifyDupPair()／dupCurrentAllGroups()'},det:/dupSignatureFromPixels|classifyDupPair/},
{id:'c_roster',st:'c',src:'q',label:'名冊比對（勾稽）：下載範本→使用者填寫→匯入→標示每家已完成／未完成',
 how:'提供名冊範本 xlsx；匯入填好的名冊，以店家代碼為 key 與資料比對，每家店標示有無完成；勾稽結果可匯出 xlsx。',ref:{q:'exportRosterTemplate()／handleRosterFileImport()／computeRosterMatch()'},det:/computeRosterMatch|handleRosterFileImport/},
{id:'c_ver',st:'c',src:'s',label:'資料版本號：每次匯入遞增，所有衍生索引與快取靠它判斷是否過期',
 how:'匯入完成後 dataVersion++；畫面層只讀來源資料、不回頭改；需要衍生資料就建快取，快取以「資料版本＋參數」為鍵。',
 pit:'不要手動清快取，否則漏清就會顯示舊資料而且不報錯。',ref:{s:'runPostParsePipeline()／svDataVersion'},det:/DataVersion/},
{id:'c_channel',st:'c',src:'s',label:'多通路並行：原始資料不先依通路過濾，計算時才分通路',
 how:'同一份工作管理資料供 CVS／連鎖超市／傳統／量販／即飲共用；通路篩選在建快取層處理；不同通路的達成規則各自獨立，不強抽共用函式。',
 pit:'若在讀入時就依通路型態過濾，同店連打、重疊等區間判斷會斷掉。',ref:{s:'buildChannelCaches()'}},
{id:'e_gallery',st:'e',src:'qrvc',label:'卡片＋縮圖清單、燈箱大圖、上一組／下一組導覽',
 how:'每筆回覆一張卡片；點開看大圖與完整答案；重複照片可在「縮圖分組」與「總覽表格」兩種看法間切換，誤判可一鍵排除並跳下一組。其他：專注模式（隱藏其他區塊）、只看有照片的回覆、縮圖分頁（每頁筆數、跳頁）、鍵盤（←→ 換張、Shift＋←→ 換筆、PageUp／PageDown 換組）與手機左右滑動。',ref:{q:'toggleFocusMode()／gridGoToPage()／rptGvTouchStart()',c:'openLightbox()'},det:/lightbox|燈箱/i},
{id:'e_annot',st:'e',src:'q',label:'圖片標註（畫筆、圓圈、箭頭）',how:'在大圖上畫標註，存回報告。'},
{id:'e_edit',st:'e',src:'q',label:'報告可直接編輯：復原快照＋自動草稿',
 how:'報告區 contenteditable；復原快照照片只存編號一份；自動草稿用 localStorage，照片超過 3MB 就直接略過（一定寫不進去）。存成 HTML 後再打開要沿用成品區，不可重新分頁把編輯洗掉。問卷工具的檢討報告另有：插入空白頁、刪頁、複製頁、拖曳調整頁面順序、拆頁／合併、可拖曳的文字框、照片區放大縮小、加入「改善後照片」（每頁最多 2 張、超過自動多開一頁）、復原／重做（Ctrl+Z／Ctrl+Y）。',
 pit:'存檔時照片別存兩份（原始區＋成品區），檔案會大一倍；控制面板不要存進檔案。',ref:{q:'rptSaveAsHtml()',q:'buildPageOrderPanel()／rvwSplitPage()／rvwMergeGroup()'},det:/contenteditable/},
{id:'e_gantt',st:'e',src:'s',label:'時段圖（甘特）：一天內到站～離站色塊，重疊自動分道，離群值另設區',
 how:'用「連續重疊群集」演算法分道；逾四小時或跨午夜的色塊延伸到軸線底／右緣；離群時間另開一區，區內仍按真實時間比例畫，不可畫成等寬格；格線用逐列背景。',
 pit:'不可「整天只要有一處重疊就全部變矮」；離群區不可疊在正常時間刻度上。',ref:{s:'業務員日誌：時段圖模式／svBuildGanttHtml()'},det:/連續重疊|gantt/i},
{id:'e_map',st:'e',src:'sa',label:'地圖：店家分布、當日路線、開工收工與臨時點（各圖層獨立開關）',
 how:'Leaflet；每個圖層各自一個 LayerGroup，開關只清自己那層；畫點只看座標表，與統計排除規則是兩件事。其他圖層與操作：營業所當天所有人的路線疊在一起（每人一色、重疊點提示）、路線加方向箭頭與序號、點清單聚焦地圖點、全螢幕按鈕、底圖載不到時自動換備援圖磚。',
 pit:'Leaflet 要連 unpkg，內網或沙盒可能載不到（18天工具就曾載不進）；要有降級（外連 Google 地圖）。截圖時 html2canvas 拍不到 Leaflet 的 SVG 圖層，連線與色塊要改 Canvas 繪製（preferCanvas）；底圖跨網域污染時只排除圖磚重試。',ref:{s:'店家分布地圖／路線圖模式',s:'svDailyOpenOfficeMap()／svAddRouteFlowArrows()／svBindTileFallback()'},det:/\bL\.tileLayer\s*\(|leaflet(?:\.min)?\.(?:js|css)/i},
{id:'e_calendar',st:'e',src:'s',label:'月曆檢視（每天一格看出勤與拜訪量）',how:'依日期排成月曆格；日期排序一律新到舊。',ref:{s:'業務員日誌：月曆模式／svBuildCalendarHtml()'},det:/月曆/},
{id:'e_chunk',st:'e',src:'sq',label:'大量資料分段顯示：先畫一段、捲到才補，或分頁瀏覽',
 how:'先同步塞約 200 列，其餘用 requestAnimationFrame 延後補；列印與截圖前自動補完。分頁瀏覽的做法（問卷工具卡片牆）：每頁筆數可選、第一頁／上一頁／跳到第幾頁；換了篩選條件回到第一頁。',
 pit:'瀏覽器 Ctrl+F 只找得到已畫出來的列；「卡頓」的真因多半是一次插入太多 DOM，不是演算法慢，先量測再動。',ref:{s:'svRenderTableChunked()',q:'gridGoToPage()／setGridPageSize()'},det:/Chunked\(|gridGoToPage|loadMore/},
{id:'e_print',st:'e',src:'qso',label:'列印版面：A4 直式、靠底色傳達意義的元素強制印出底色',
 how:'@media print 規則；時段圖色塊、徽章、表格標題列、圖例等靠 background 顯色者，都要加 print-color-adjust: exact。列印前自動準備：先補完分段渲染的列、展開有捲軸的區塊、隱藏操作列、過寬表格自動縮放、表頭每頁重複；印完還原。',
 pit:'瀏覽器預設不印背景色與背景圖；用 page.pdf 的 printBackground 測試會繞過這個行為，看不出問題。',ref:{o:'preparePrint()'},det:/print-color-adjust/},
{id:'f_pptx',st:'f',src:'q',label:'PPTX 匯出（滿版照片格線）',
 how:'用 PptxGenJS 動態載入，每張投影片只有一塊滿版照片區，依張數排成接近正方形的格線。',
 pit:'要連網（jsDelivr）；載不到要提示，不可靜默失敗。',ref:{q:'rvpExportPptx()'},det:/PptxGenJS/},
{id:'f_share',st:'f',src:'s',label:'其他送出管道：同步 Google 試算表、LINE 名冊文字、郵件',
 how:'同步走 Google Apps Script 網頁應用程式（要連網）；LINE 名冊與追蹤清單轉成純文字複製；郵件用 mailto: 帶主旨與內文。同步試算表的細節：一次送出所有月份、雲端只取代這些月份（其他月份保留）；送出前先確認雲端程式版本，不是新版就略過以免清空整張表；密碼不寫在程式裡，第一次同步時輸入、只存在本機瀏覽器，密碼錯就清除重問。郵件網址過長時系統會靜默不開，名單長就改成複製到剪貼簿。',
 pit:'這是唯一會把資料送出瀏覽器的功能，要讓使用者明確點選，且不能和「資料只在瀏覽器內處理」的說法互相矛盾。',ref:{s:'gsheetSyncAllChannels()／gsheetCheckGuard()／gsheetGetPwd()'},det:/script\.google\.com|mailto:/},

/* ---- v03 新增：線上型看板 巡補看板 1.55.1（r）與覆蓋率看板 3.17.0（v） ---- */
{id:'z_shared',st:'z',src:'rv',label:'共用骨架放在同資料夾 shared/（不是單檔）',
 how:'共用的複製、CSV、截圖、燈箱照片、逐題彙整、彙整看板、版面外殼放 shared/*.js 與 shared/dashboard-common.css；每個看板自己的業務計算不共用。',
 pit:'這和「單檔 HTML」互相衝突：只拿到單支看板時，AI 看不到 shared 內容，不能保證渲染結果，也不敢動共用邏輯；要整併功能前先拿到 shared 檔。要單檔交付時須把共用檔內嵌回來。',det:/shared\//},
{id:'z_auth',st:'z',src:'rv',label:'簡易登入閘（前端檢查 localStorage，沒登入就導回首頁）',
 how:'頁首一小段 script：localStorage 的登入旗標不是 1 就 location.replace 回入口頁；獨立部署不經登入頁時整段拿掉。',
 pit:'這只是前端擋一下，不是真的安全。試算表若是「知道連結就能看」，直接開連結照樣讀得到資料。',det:/localStorage\.getItem\(\s*['"]\w*auth/i},
{id:'a_sheet',st:'a',src:'rv',label:'資料不上傳，進站時從 Google 試算表線上讀（網址帶 ?sheetId=）',
 how:'用 URLSearchParams 取 sheetId；每個專案一份試算表；進站依序讀設定分頁→名冊→紀錄→問卷；互不相依的請求同時發出，並預先 preconnect docs.google.com 加速。',
 pit:'斷網或沙盒讀不到真實資料，測試只能用合成資料；試算表要設成「知道連結的人可檢視」；管理表的 ID 寫死在程式裡，別貼到公開處。',ref:{r:'fetchBoardConfig()／fetchPopulation()',v:'啟動流程（讀設定→專案管理→主資料）'},det:/\/gviz\/tq/},
{id:'a_cfgsheet',st:'a',src:'rv',label:'設定放試算表分頁，不放 HTML（業務改設定就好）',
 how:'「看版設定」分頁由多個【區塊標題】小表上下排列，程式自己掃出每個區塊（檔期、等級對照、通路設定、必訪規則…）；先讀設定、讀完才建篩選列與抓資料；讀失敗就顯示錯誤並中止，不用殘缺設定硬跑。覆蓋率看板另有「新格式（各專案自己的分頁）優先、舊格式（集中管理表）退回」的相容做法，兩邊同時發請求。',
 pit:'區塊內欄位順序不能亂動——順序錯了不會報錯，只會塞錯欄；通路設定的判斷值支援 * 當兜底，必須排在最後；部署新專案要連「設定分頁」一起複製。',ref:{r:'_scanConfigSections()／_applyBoardConfig()',v:'_fetchNewBucketConfig()'},det:/_scanConfigSections|CFG_SHEET|BUCKET_CFG_SHEET/},
{id:'b_gviz',st:'b',src:'rv',label:'讀 Google 試算表查詢介面（gviz）的 JSON：欄名當 key、處理型別陷阱',
 how:'fetch gviz/tq?tqx=out:json，剝掉外殼取 JSON，用欄名組成每列一個物件；日期欄另外轉換。',
 pit:'gviz 依整欄大多數內容推斷型別：日期欄的「表頭文字」會被丟成空值（欄名整個漏收），數字欄裡的文字值也會被丟。對策：headers=0 自己找表頭列、必要時二次請求補回文字值（回填要照原始列序，幽靈列要最後才濾）；試算表端日期欄要用日期格式、店代碼設純文字。',ref:{r:'gvizParse()',v:'_fetchQuestionnaireSheet()'},det:/gvizParse|gviz\/tq/},
{id:'c_diag',st:'c',src:'r',label:'設定診斷：被跳過的設定列、對不上的 key、重複規則，分三級列出',
 how:'解析設定時把問題記成 error／warn／info；平常不打擾，有問題才在按鈕上顯示紅點數字，點開看清單。對不到名冊的外部列也只記一筆診斷，不擋其他資料。',ref:{r:'_cfgDiagPush()'},det:/CFG_DIAG|_cfgDiag/},
{id:'c_quota',st:'c',src:'r',label:'每週應達次數對照等級；已達與超額分開算',
 how:'應達＝等級對照表；實際＝同店同天只算 1 次；已達＝min(實際,應達)；超額＝max(0,實際−應達)。達成率＝Σ已達÷Σ應達（分母用應達，不用實際）。通路可設「不分等級預設值」，指名等級優先。',
 pit:'超額絕不進達成率的分子分母，也不可跨店外溢（逐店逐週算完才加總）；等級文字必須與名冊完全一致（含全形字），對不上就是「等級未知」、應達算 0。',ref:{r:'_buildActualIndex()／_stdFreqAt()'},det:/ACTUAL_INDEX|GRADE_FREQ/},
{id:'c_period',st:'c',src:'r',label:'檔期與週次：每 7 天一週，最後一週不足可折算或不折算',
 how:'巡補日期−檔期起始日，每 7 天一週；晚於終止日的不屬於任何檔期；不足整週時應達＝max(1, ⌊天數/7×整週應達⌋)；可設「不折算」強制照原值要求。顯示的日期區間、過去週判斷、必訪日清單一律裁切到終止日。',ref:{r:'_classifyParts()'},det:/_classifyParts|PERIODS\b/},
{id:'c_group',st:'c',src:'r',label:'分組縮減門檻：整組達標，個別沒去的店不算欠（只影響彙總）',
 how:'同營業處＋通路＋等級為一組；折算週時動態算縮減後的家數門檻；整組達標則沒去的店不算欠。所有用到的地方都呼叫同一個函式。',
 pit:'只影響「還缺幾家」這類彙總數字，絕不回頭改任何單店格子（系統答不出是哪一家被算進門檻，硬改等於捏造達標）。所以「總覽數字」與「單店明細」不相等是正常的。比對邏輯不可各處自己重寫，否則兩張表會對不起來。',ref:{r:'_quotaUnitProgress()'},det:/_quotaUnitProgress/},
{id:'c_mustvisit',st:'c',src:'r',label:'必訪星期規則（與次數標準須同時達成）',
 how:'規則＝通路＋等級＋必訪星期（0=日…6=六）；符合的店每週指定星期必到；只在「規定日已過去」才判未達，當天與未來顯示尚未到期；一店最多吃第一條相符規則。次數標準與必訪規則同時存在時，兩項都達成才算達標。',ref:{r:'MUST_VISIT_RULES／_mustVisitRuleForStore()'},det:/MUST_VISIT_RULES/},
{id:'c_extra',st:'c',src:'r',label:'外部名單併入紀錄（例：工讀排班），只取店代碼＋日期',
 how:'外部單位維護的清單只取「店家代碼」「日期」兩欄，併入與正式紀錄同一份索引並標記來源，達成率與必訪判斷自動一起算對；其餘欄位只供人工比對。畫面用徽章與正式紀錄區分。',
 pit:'日期欄要是試算表日期格式；店代碼要與名冊完全一致（含全半形），對不到的列不計入任何店。',ref:{r:'fetchWorkShiftSheet()'},det:/fetchWorkShiftSheet|source\s*:\s*['"]temp['"]/},
{id:'c_bucket',st:'c',src:'v',label:'鋪貨狀態分組：已鋪貨（B 群）／確認未鋪貨（C 群）／未填寫／待確認',
 how:'設定決定哪些問卷欄位算已鋪貨（B 群）、確認未鋪貨（C 群），各有標題；資料列存在卻對不到任何已知狀態者歸「待確認」（與「未填寫」分開）。問卷表頭比對欄位有兩種命名：與主表欄名完全相同；或「大題_選項」格式（先用前綴鎖定大題、再比選項文字）。',
 pit:'命中率整批 0% 多半是問卷表頭命名沒被涵蓋，不是資料錯；先確認表頭命名，別為單一專案去改通用比對。同一段地點文字常重複出現在不同大題底下，只比選項文字會兩邊都誤判命中。',ref:{v:'_covRecordMatchedCols()'},det:/_covRecordMatchedCols|COL_UNFILL/},
{id:'d_range',st:'d',src:'v',label:'時間範圍與燈號：週／月／自訂區間，B／C／未填寫／待確認可各自開關',
 how:'常駐在燈號列：上一期／下一期／本期／全部＋週月下拉＋自訂起訖日；燈號各自開關，卡片與彙整看板即時連動。',ref:{v:'_cwShiftPeriodStart()'},det:/_cwShiftPeriodStart|cwn-pager/},
{id:'d_flag',st:'d',src:'r',label:'獨立開關按鈕：進行中未達標／已逾期未達標／超額／必訪未達（可同時開）',
 how:'四顆互不互斥，同時開取聯集；總覽表的「未達店數」點下去會帶入對應開關。'},
{id:'e_trend',st:'e',src:'voxs',label:'趨勢圖：期間走勢，本期尚未走完要特別標示',
 how:'整頁呈現；預設只顯示總覽線，可單看／比較／篩選；本期還沒走完用虛線、空心點與 ⏳ 提示，並加「說明」彈窗講怎麼讀圖。其他做法：儀表板的業績頁有趨勢面板（年度比較線＋統計表），缺貨工具的跨期比較可點選品項加入／移出走勢圖，18天工具的月別圖標題帶目前篩選範圍。',
 pit:'最右側本期常「看起來沒畫出來」，多半只是本期還沒走完、數值天生偏低，不是渲染錯。',ref:{s:'sharedTrendChartHtml()',o:'lineChart()'},det:/trend-dialog|sharedTrendChartHtml|lineChart\(/},
{id:'e_board',st:'e',src:'rvs',label:'彙整看板／戰情看板：各層級達成統計表，點格子跳到明細再回來',
 how:'6 個分頁，含跨營業處所比較表與「待確認」欄；實作在共用的 pivot-dialog.js；巡補看板的工具列也有「彙整看板」群組（照片牆、逐題彙整、細項匯出）。儀表板的「戰情看板」是同一類：依通路列出營業處→營業所→人員的達成統計表（數字固定寬度、右對齊），點格子跳到對應明細，並留一顆「↩ 回到戰情看板」浮動鈕。',ref:{s:'computeOverviewChannelData()／showOverviewModal()'},det:/彙整看板/},
{id:'e_cell',st:'e',src:'r',label:'週次格子：應達內藍色、超額橘色，四種互斥標籤',
 how:'每週固定 7 格（前 N 格為應達，其餘超額或空位）；標籤：✓已達成／🤝組已達標／⚠️逾期未達成／🕒本週進行中，有應達次數的格子一定落在其中一種；必訪日加星期小徽章與紅框高亮。',det:/mv-alert-cell|stdDone/},
{id:'e_rank',st:'e',src:'rpqos',label:'排行榜：人員／店家／品項排行，可點跳到明細',
 how:'依訪員＋分組彙總；主要指標只算「自己完成」，三態：⚪尚未開始／🔵進行中／🟢已達標，不用紅黃綠恐嚇字眼；純來幫別人的另歸「🤝純支援」排最後。完成度長條只有兩段：自己完成、整組免驗。通用做法：依指標排序、前幾名可調（5／10／20）、每列可點開明細；打卡工具有店家排行（不分人員看哪些店最常有異常），問卷工具有業務員重複照片排行（張數、占比、涉及店數，點名字跳到明細），缺貨工具有各營業處 TOP 排行。巡補看板的版本如下：',
 pit:'別人代跑不算自己完成，避免代跑湊出的達標蓋過真正沒做完的事實。',ref:{r:'openStaffContribution()',q:'dupComputeLeaderboard()',p:'storeAgg()',o:'topT()'},det:/openStaffContribution|dupComputeLeaderboard|storeAgg\(|topT\(/},
{id:'e_manpower',st:'e',src:'rw',label:'人次估算工具（只看名冊與等級次數，不看實際紀錄）',
 how:'獨立的篩選條件（不受主畫面影響），試算排班人次，可收斂到檔期／通路／等級／營業處／營業所並匯出 CSV。',det:/MANPOWER_FILTER/},
{id:'e_mobile',st:'e',src:'rv',label:'手機版面＋長按提示（長按後短時間內擋掉 click，避免誤觸進入下一層）',
 how:'週次切換、店卡瘦身；長按顯示 tooltip，用時間戳讓 600ms 內的 click 失效。',det:/_lastLongPress/},
{id:'e_sticky',st:'e',src:'rv',label:'多層固定列（sticky）疊放，彈出面板改用 fixed 定位',
 how:'工具列→燈號列→快速導覽依序疊放，各層 top 由程式在每次渲染與縮放後動態算。彈出面板用 position:fixed，開啟時依按鈕座標算位置，並監聽 resize 與捲動。',
 pit:'容器設 overflow-x:auto 會連帶把 overflow-y 也變成 auto，底下用 absolute 彈出的東西會被裁掉：現象是「點了有反應但畫面沒東西」，容易誤以為 onclick 沒綁到。',ref:{v:'updateStickyTops()／_cwPositionCustomBox()'},det:/updateStickyTops/},
{id:'f_detail',st:'f',src:'rv',label:'細項匯出：跨欄位勾選，即時看符合家數，再輸出 LINE 或 CSV',
 how:'可跨 B／C 桶勾選子欄位，勾選當下就看到符合的家數，再決定輸出。實作在共用檔。',det:/細項匯出/},

/* ---- v05 新增：解析 12 支工具後拆出的元件（c＝CVS菸品獎勵、h＝人力調查表、a＝店家分配、d＝去識別化、g＝虛擬生產器、o＝缺貨通報、w＝勞逸比、l＝報表連結；另含 p／x／q／s 新版本的新功能） ---- */
{id:'z_update',st:'z',src:'pxqshadgol',label:'「檢查更新」：開啟時查 GitHub 有無新版，有就提示可直接下載（不原地改寫自己）',
 how:'讀 api.github.com/repos/…/contents/ 列出 repo 根目錄檔名，找「名稱相同、版號更大」的 .html（容許 _v8／_V05／V34 各種寫法）；有就在頁面頂端顯示提示條：直接下載（fetch raw 後以 blob 存檔）／略過此版／稍後再說。標題旁一顆「檢查更新」按鈕：不看暫存與略過、一律重查，並明確回應（已是最新版／查詢失敗）。自動檢查結果暫存 10 分鐘，失敗一律靜默。',
 pit:'各工具內部統一稱「GitHub 檢查更新」，畫面按鈕一律叫「檢查更新」，不叫自動更新、線上更新；只偵測與下載，不原地替換（避免檔案被自動改寫）。比對用的工具名稱 key 必須與檔名前綴相同，改名要同步改；舊版要搬進子資料夾（只掃根目錄）。file:// 頁面共用同一份 localStorage，各工具的暫存鍵不可共用。快照、匯出的 PDF 不含此功能，列印與截圖要隱藏提示條（data-shot-skip）。這是唯一會連網的功能，使用者會在意資料是否外傳，要讓人看得出只查檔名、不送資料。',
 ref:{p:'checkUpdate()',s:'GitHub 檢查更新（檔案最末獨立 script）',d:'checkUpdate()／UPD',h:'checkUpdate()'},det:/api\.github\.com\/repos/},
{id:'z_deid',st:'z',src:'psd',label:'人名去識別化（共用核心）：「交給外部」代號、「內部閱讀」遮蔽，只在匯出出口處理',
 how:'訪員＝「姓名-純數字員編」，其餘一律非訪員。交給外部：訪員→訪員＋假員編後 6 碼-假員編（例 訪員601511-9601511，假員編 9 開頭、由固定加密參數（salt）＋真員編計算雜湊，跨月、跨工具都相同）；沒有員編的人→人員042；客戶聯絡人→聯絡人317；組織／共用帳號不變。內部閱讀：姓名保留頭尾、中間換○（王○明，間隔號保留），員編一律數字反轉；沒有員編者遮蔽後同名加 A、B。畫面永遠是真名，只有匯出檔（PDF／HTML／Excel／檔名／ZIP 名）被替換；去識別化工具另出一份只供本人留存的對照表 CSV。',
 pit:'各工具的去識別化核心程式要完全一致（版號一起升），固定加密參數（salt）一改，所有代號都會變。以下做法已評估後不採用：撞號時改用其他號段、員編前後加英文字母、只遮員編、換成假姓名、依匯入順序編號（例：訪員001）。全文掃描只換已知員編，前一字是○的不再處理，否則重複套用會二次反轉成真員編。開頭帶星號（*、＊）的離職人員要先去星號再判斷，否則真名原樣外洩。截圖是圖片、換不掉，要先提醒。',
 ref:{p:'去識別化核心 DEID（匯出視窗③）',s:'去識別化核心 DEID（備忘 57）',d:'DEID_CORE'},det:/\bDEID\.\w+\(|\bconst\s+DEID\b/},
{id:'z_testgen',st:'z',src:'g',label:'測試資料產生器＋答案卷（種子可重現、注入異常與陷阱）',
 how:'產生欄位、檔名、格式都比照真實檔的模擬原始檔（工作管理 CSV、客戶資料 xlsx…），同一批人員與店家在各檔彼此一致；可注入各類異常（應檢出）、應被排除的干擾資料、備查項（列入觀察、不計異常），另出一份「答案卷」逐筆列出；同一個種子每次產生結果相同，可連續產生多個月份、每月一個 YYYYMM 資料夾打包 ZIP。用法：把產出檔匯入要測的工具，逐類比對件數與答案卷。',
 pit:'判定門檻要集中在一處（RULE），規則以「規則來源工具」為準；規則一改，先改門檻與答案卷文字，再拿產出逐類比對。欄位之間的因果（店家型態→通路別→店家等級→店碼格式）要用真實檔校正，不可亂猜；沒拿到真實樣本的型態寧可不產生。常態資料要刻意避開意外異常，答案卷才會精確。',
 ref:{g:'gen()／RULE'},det:/答案卷/},
{id:'z_rulesrc',st:'z',src:'psga',label:'規則同源：一支工具當「規則來源」，其他工具只加門檻或只讀結果',
 how:'例：儀表板＝打卡異常判定規則本身、不設容許值；檢核工具＝儀表板判定＋各種門檻，容許值全填 0 時要與儀表板逐筆相同；分配工具只讀儀表板算好的通路效率係數、主要通路、產能，不重算。規則先改來源工具，其他工具再照改，最後用同一批資料逐筆比對。',
 pit:'分工約定要寫進每支工具的開發紀錄，不可擅改；獨立測試版調好後要整段併回主系統，並重做一次比對，不要兩邊各改各的。'},
{id:'z_nogray',st:'z',src:'cs',label:'禁用灰色字體（文字對比至少 4.5:1）',
 how:'一般說明文字用深色；要區分層級改用字重、底色色塊或品牌色，不用降低對比的灰字。',
 pit:'灰字在投影與列印時常看不清楚；改到殘留舊灰字的區塊要順手換掉。'},

{id:'a_accum',st:'a',src:'cq',label:'分次累加收集：不同種類的檔案可分好幾次丟，湊齊必要檔才開始計算',
 how:'所有入口（拖放、選檔、選資料夾、zip）先進同一個暫存清單，畫面顯示目前已收集的檔案；至少湊到一份必要的 xlsx 才真正開始解析，沒湊齊不跳警告擋人，只顯示狀態讓使用者繼續補。',
 ref:{c:'handleFiles()／pendingUploadFiles',q:'mergeIntoPending()（照搬 CVS 工具）'},det:/pendingUploadFiles/},
{id:'a_zip',st:'a',src:'cd',label:'匯入 ZIP：就地解壓，資料夾層級保留',
 how:'JSZip 解開使用者丟進來的 .zip，逐檔依副檔名分流（xlsx／csv／圖片）；去識別化工具輸出時照原資料夾結構重新打包。',
 pit:'只接受清單內的副檔名，其餘略過並列出；zip 內的資料夾名稱不要拿來當判斷依據，只取檔名。',ref:{c:'collectImageSources()'}},
{id:'a_photofile',st:'a',src:'c',label:'純圖片檔依「檔名規則」比對到資料列（可事後追加，取代 Excel 內嵌縮圖）',
 how:'圖片檔名含 店家型態-店家-日期-業務員-員編…；解析檔名分組後，比對已建好的店家與三個階段日期，寫回該階段照片並清掉「缺照片」提示，再重算畫面。首次上傳與事後追加共用同一個比對函式。對不上的照片要逐張說明原因（檔名格式不符、找不到人、日期不在任何階段）；檔名先去掉下載時自動加的「(1)」等重複字尾再比對。',
 pit:'比對成功就整組「取代」不是附加（外部原圖畫質一定比內嵌縮圖好）；同一人同一天對到多筆時全部貼上並標「需人工確認」，不要自動挑一筆；店名本身含「-」會切錯，要列為已知限制。',
 ref:{c:'buildPhotoGroupsFromSources()／attachImportedPhotosToStores()／handleExtraPhotoImport()'},det:/handleExtraPhotoImport|buildPhotoGroupsFromSources/},
{id:'a_pack',st:'a',src:'a',label:'讀上游工具匯出的「資料包」（gzip JSON，帶格式名稱與版本）',
 how:'資料包＝{format:\'sv-alloc-pack\',v:1,ym,…}；讀入時先檢查 format 與 v，不對就拒收並說明要從哪一支工具、哪個按鈕匯出。規則與計算定義都由上游算好放進包裡，本工具只讀不重算。',
 pit:'資料包常含真名與員編；要給外部時，應先用去識別化工具處理原始檔、再匯入上游、再匯出，不要直接轉寄資料包。',ref:{a:'讀取資料包'},det:/format\s*[!=]==?\s*['"]sv-alloc-pack/},
{id:'a_url',st:'a',src:'l',label:'貼上來源網站網址，自動帶入日期、編號、資料模式',
 how:'用 URL 物件讀查詢參數（起訖日、問卷編號、含圖／純值），填回畫面；解析失敗時明確告訴使用者要從哪一頁的網址列複製。',ref:{l:'tryParseUrlAndFillDates()／detectModeFromUrl()'},det:/tryParseUrlAndFillDates/},
{id:'a_template',st:'a',src:'h',label:'「新範本」從空白表開始填，也能匯入舊檔（含舊版格式、.ods）',
 how:'內建預設單位清單（經理室、行銷課、A所…）；匯入時找表頭列、跳過重複的標題列、中間有空白列也不提早停止，並自動判斷舊檔有沒有蓋章欄、自動對應所別名稱。',ref:{h:'blank()／runImport()／findHdr()'},det:/新範本/},

{id:'b_dyncols',st:'b',src:'co',label:'萬用欄位偵測：依表頭樣式找出所有品項欄，不寫死品項名稱與數量',
 how:'掃表頭找出符合樣式的欄（例：「XXX銷售數量(包)」，或「回報時間」之後的每一欄都是題目），自動分組；多檔時品項取聯集。換品項、加品項、改名都不用改程式。',
 pit:'這是工具的核心設計，之後改功能不可為了方便寫死品項名稱或欄數。',ref:{c:'detectProducts()',o:'ingest()'},det:/detectProducts/},
{id:'b_xmlpatch',st:'b',src:'d',label:'直接改 xlsx 內部 XML（不經 SheetJS 重存，圖片與格式都保住）',
 how:'JSZip 打開 xlsx：文字格改 sharedStrings（同字串全檔一致），數字與 inlineStr 逐格改；刪列時合併儲存格、dimension、圖片錨點（xdr:row）一起上移；docProps 建立者清空。',
 pit:'SheetJS 重存會丟圖片與格式；有公式、表格、註解的工作表不要動列。.xls 舊格式不支援，請使用者先另存 xlsx。',ref:{d:'xlsx 處理段'},det:/sharedStrings\.xml/},

{id:'c_engine',st:'c',src:'c',label:'規則引擎：計算規則做成資料（獎勵項目卡片），不寫死公式',
 how:'先抽掉業務用詞看數學結構，拆成幾種獨立類型（例：累進級距、逐品項達標、合計達標＋地板值），每個案子＝N 張自由命名的卡片，每張選一種類型＋門檻表＋金額上限；改規則立即重算，不用重新上傳。',
 pit:'同一個業務詞在不同案子可能是不同算法，不要用名稱判斷算法；同一案子不能有兩張卡選同一種算法；數值欄位一律夾到 ≥0；改動會影響實際撥款金額，改前先用真實案例的數字核對。',
 ref:{c:'calcReward()／calcTarget()'},det:/calcReward/},
{id:'c_lock',st:'c',src:'c',label:'硬性管控：不合規就鎖住不發放，另有「解除管控」總開關（只在本次頁面有效）',
 how:'例：兩階段間隔不足 28 天，鎖定該階段獎勵（金額歸零但保留「本應核發」金額供財務參考）；資料不足無法驗證時也視為鎖定。總開關解除後照常核發，但所有畫面改用琥珀色 ⚠️ 標示「管控解除後照常核發」，與正常核發、真的被鎖 🔒、真的沒達標 $0 三者分得清楚。',
 pit:'解除開關重新整理就恢復（安全預設），不存起來；按下前 confirm 講清楚後果。被鎖的事實在稽核報告裡照列，不因解除而消失。',ref:{c:'applyGapLock()／GAP_LOCK_OVERRIDE'},det:/applyGapLock|GAP_LOCK/},
{id:'c_followup',st:'c',src:'c',label:'跟催提醒與下次可回報倒數（還差幾包、建議完成期限）',
 how:'依每家店「最近一次回報、但這階段還沒結束」的數字，算距離各達標門檻還差多少，附建議期限；跑完全部階段或還沒開始的店不列。單店可複製，也可複製整份清單轉給業務。被鎖定的店改提醒「確認日期是否正確」。',
 ref:{c:'computeFollowUpForStore()'},det:/computeFollowUpForStore/},
{id:'c_mainvis',st:'c',src:'xswg',label:'主責業務（主訪）判定：等級「-」無主責、S 有多人為重複主責、其餘為執行人員本人',
 how:'同一店家代碼的所有客戶列一起看：只有「-」＝無主訪；恰一個 S＝該列執行人員是主責；兩個以上 S＝重複主訪；非 S 但多位執行人員時取列數最多者。執行人員尾端「-員編」去掉再比對。',
 pit:'這是已確認的業務規則，各工具要用同一套定義；客戶等級「A」是營業單位設錯，忽略。純數字姓名（如 1005）是單位虛擬帳號，不算訪員。',ref:{w:'主訪判定',s:'svBuildPrimaryStoreDist()',g:'客戶主訪判定（答案卷分頁）'},det:/重複主訪/},
{id:'c_load',st:'c',src:'swa',label:'工作量與忙閒：以月為單位，同一營業所內「人與人」相比',
 how:'工作量＝Σ每月應訪次數（依店家等級對照，畫面可改），可再依通路加權（通路效率係數 k＝以該通路為主的人一天能完成幾次拜訪，由近 3 個月全公司數據算；每次拜訪＝1/k 個工作天）；負荷比＝個人工作量 ÷ 所內人均；≥1.3 倍偏重、≤0.7 倍偏輕（同所至少 3 人）。',
 pit:'公司沒有工作負荷（勞逸比）的絕對標準；用固定門檻時幾乎全員偏閒，所以改同所相對判定。字眼用「相對偏重／偏輕」，不要說超載、偷懶、冗員。停留時間、路程目前不進計算，要列為已知限制。',
 ref:{w:'DEFAULT_FREQ',s:'svWlrBuildPlan()／svWlrRollingK()'},det:/偏輕|偏閒/},
{id:'c_scheme',st:'c',src:'swa',label:'配置方案比較：現況／區域制／通路制／混合制／最小異動並排',
 how:'每個營業所各自試算多種分法，列出工作量落差、每人通路數、跑最遠的人、範圍重疊、異動店數；系統建議依既定優先順序（通路專精→工作量相近→區域集中→異動少）挑選，只是參考，主管決定。',
 pit:'指標名稱要精確（例：「同通路交錯」與「不分通路交疊」是兩件事，混在一起會被質疑）；系統建議若比現況多跑很多或通路數變多，要在理由中寫明。',ref:{w:'通路制／區域制模擬',a:'方案起點下拉',s:'⚖ 方案比較'},det:/通路制/},
{id:'c_alloc',st:'c',src:'sa',label:'分配引擎：依產能比例反覆對半切區、最佳化分配通路、負荷平衡、偏遠店交給就近人員',
 how:'區域：沿店家分布最長的方向用直線依產能比例切兩半，再各自往下切（遞迴二分），範圍互不交錯；通路：依主管勾的「誰做哪些通路」，用網路流（最大流）演算法算出每人負荷率盡量一樣的量，再依同樣方式切區；非主要通路店不算工作量，但一律指派給有做該通路且不太遠的人；量少又分散的通路改依區域給當地的人。',
 pit:'每家店都要有人負責（沒有負責人的店算「待分配」並提示）；量販等少量特殊通路不進自動分配、由主管手動指定。邊界是直線、未考慮道路與行政區，要列為已知限制。',ref:{a:'svAlloc*（目標是與儀表板完全一致）'},det:/svAlloc/},
{id:'c_cut',st:'c',src:'x',label:'訂單滿足率分析（俗稱砍單分析）：足量出貨／部分短出／整張未出',
 how:'同一張訂單比下單量與出貨量，分三類；依月份▸營業處▸營業所▸店家逐層展開，看短出量、短出率（＝1－訂單滿足率）、被短出店數、最近短出日，有去年資料時並列差異；所有數字可點開看訂單明細，另附一段可點的文字小結。',ref:{x:'砍單分析頁籤'},det:/砍單/},
{id:'c_onemetric',st:'c',src:'op',label:'全工具只用一種計算定義，表頭寫明分母',
 how:'例：所有「缺貨」數字一律是缺貨店數（同店同品項在所選期間只算 1 家），表頭寫「巡店 N 家」；打卡工具定為樣態＝項、工作規劃＝筆。另一種指標（例：缺貨率）就用不同名稱，不混用。',
 pit:'不同頁籤計算定義不同時，主管看到數字對不上就會懷疑整份資料；被移除的計次方式寧可保留程式不顯示，也不要讓畫面同時存在兩種算法。'},
{id:'c_scope',st:'c',src:'o',label:'連續與範圍分類：連續缺貨、全台性／區域性／單一處／零星',
 how:'同一家店相鄰兩次巡店都缺同一品項＝連續；某品項在幾個營業處進榜決定範圍（≥5 處全台性、≥2 區域性、1 單一處）；表格用色標出。',ref:{o:'persist()／pivRows()'},det:/連續缺貨/},
{id:'c_segment',st:'c',src:'l',label:'日期區間切段（每 N 天一段）＋依營業處／營業所再切',
 how:'起訖日依每段天數切成多段（0＝不切、上限 90 天），可再依營業處或營業所勾選清單展開成更多段，每段組出一條下載網址；檔名依「報表名_單位_區間_時間」或「報表名_區間_單位_時間」排序。',
 pit:'檔案太大或常逾時時要引導改切更細，而不是一直加長逾時。',ref:{l:'buildSegments()／buildUrlForSegment()'},det:/buildSegments/},
{id:'c_reconcile',st:'c',src:'xq',label:'跨來源比對（勾稽）：甲有乙沒有、疑似停業',
 how:'例：SAP 客戶主檔有、但業務系統沒建檔的店；無訂單又無巡店紀錄的疑似停業店自動排除並列出；資料管理頁另列「可匯入資料一覽」與幾項勾稽檢查結果。',ref:{x:'資料管理：資料勾稽'},det:/資料勾稽|勾稽檢查/},
{id:'c_check',st:'c',src:'h',label:'即時資料檢查：空白、重複、對不上、名稱含空白，頂端一行列出',
 how:'每次編輯就重查：空白名稱、單位重複、所別不在清單（並建議可對應的名稱）、配對對象不存在、名稱含空白（黃底紅框高光）；全部通過顯示 ✓。',ref:{h:'warn()／hasSp()'},det:/hasSp/},

{id:'d_week',st:'d',src:'osv',label:'期間步進：上一期／下一期（週或月），預設本期，沒資料的期跳過',
 how:'所有頁籤跟著週別走；首次匯入停在最新一週，之後加檔停在原本那週；沒資料的週跳過、前後沒資料時按鈕變灰；跨期比較頁忽略週別。儀表板以「月」為單位：查看月份預設電腦本月，本月沒資料就退回最新月，左右鍵切上一月／下一月；覆蓋率看板另有週／月／自訂區間。',ref:{o:'wkBar()／setWeek()',s:'stepMonthFilter()／svDefaultYm()'},det:/setWeek|wkBar|stepMonthFilter/},
{id:'d_dims',st:'d',src:'x',label:'自訂階層：自選維度順序與層數，每層可單獨排序',
 how:'維度（營業處、營業所、店家、月份）可選 1～4 層、不可重複，另有幾組常用預設；第一欄標題裡的每個維度可單獨點擊排序（小→大、大→小、取消），各層互不影響；切換階層時恢復預設。',ref:{x:'砍單分析「階層」下拉'}},
{id:'d_staff',st:'d',src:'a',label:'人員增減：調離、新增人員（設產能），調離者的店變「待分配」',
 how:'人員卡片「✕ 調離」→ 不再參與分配，店變灰色待分配，可一鍵「交給其他人補位」（就近、負荷低者優先）或自己圈選；「＋ 新增人員」從 0% 開始。依營業所存在瀏覽器。',
 pit:'畫面用詞「調離」，不用「離職」（人可能是調到別所）；只剩 1 人時也要能指派與補位。',ref:{a:'alloc-tool-staff-v1'},det:/alloc-tool-staff/},

{id:'e_rules',st:'e',src:'c',label:'設定視窗＋「規則組」：整套規則存成一組、下拉切換，隨快照帶走',
 how:'設定集中在一個視窗，最上方是規則組下拉，其下是規則卡片與一行「目前設定」白話摘要；規則組存 localStorage，換案子一鍵切換；也寫進快照，同事開快照就用當時的規則。讀到舊格式的規則組要退回預設、不能壞掉。區間表要自動檢查重疊並標紅；每張規則卡有固定字母代號（A、B…），設定視窗與主表格欄名用同一套代號。',
 pit:'localStorage 綁在這台電腦的這個瀏覽器，換電腦不會同步，要用快照分享；改規則後主表格欄位要同步重建（曾漏掉）。',ref:{c:'saveCurrentAsRewardPreset()／applySelectedRewardPreset()'},det:/RewardPreset|rewardPresets/},
{id:'e_form',st:'e',src:'h',label:'可編輯表單：新增／刪除列、▲▼ 或拖曳排序、序號、即時小計與合計',
 how:'三張表各自可調列序（按 ▲▼ 或抓住 ⠿ 拖曳），有篩選時只跟同篩選內相鄰列交換，移動後保留捲動位置；計算欄即時重算、合計列不編號。',
 pit:'拖曳排序時不要觸發「放開滑鼠，匯入檔案」的匯入提示（只有外部拖入檔案才顯示）。',ref:{h:'moveRow()／stepRow()／refresh()'},det:/moveRow|stepRow/},
{id:'e_lasso',st:'e',src:'sa',label:'地圖手選店家（框選／圈選／點選＋累加）→ 點人指派，即時重算，可復原',
 how:'工具列 ✋移動／▭框選／✎圈選／👆點選；選取受通路篩選影響，浮動面板顯示已選家數與工作量；按左邊某人即指派，圈選時預覽「指派給他會變成幾 %」；復原保留 50 步；可「以目前方案為底稿重來」。結果依營業所存在瀏覽器。',
 pit:'圈選模式要能拖動地圖（畫完自動回移動、空白鍵暫時拖動）；工具列透明外框不可擋住地圖拖曳；截圖要改 Canvas 繪製才不會偏移。',ref:{s:'店家分布地圖：手選店家',a:'手動調整'},det:/圈選/},
{id:'e_terr',st:'e',src:'a',label:'責任區地圖：六角格塗「最近那家店」的負責人顏色（與外框色塊二選一）',
 how:'地圖切成六角格（半徑 TERR_R 公里），每格塗最近一家主要通路店的負責人顏色，只畫店家附近；受通路篩選影響；格數過多自動放大格子。保留原本的外框色塊（凸包）可切換，選擇記在瀏覽器。',
 pit:'外框色塊會互相蓋住、看不出邊界，責任區地圖就是為此而做；少量特殊通路（量販）用黑框大點單獨標示，不進色塊。',ref:{a:'TERR_R／TERR_BUF／TERR_MAX'},det:/TERR_R/},
{id:'e_steps',st:'e',src:'l',label:'步驟式引導：①②③ 大步驟，做完打勾，一顆主要大按鈕',
 how:'頁首列出三個步驟，每做完一步標成完成；畫面只留一顆主要動作按鈕（產生並複製），其餘選項收在「進階設定」。',ref:{l:'setStepDone()'},det:/setStepDone/},
{id:'e_heat',st:'e',src:'o',label:'熱力配色排行表：數字越大底色越深，跨區重複者另標色',
 how:'TOP 排行依各區前 N 名的重複涵蓋數上色（5 處以上都進榜＝全台性、只有 1 處＝單一地區），全台欄依數值深淺；表下附一行圖例。',ref:{o:'topT()／heat()'},det:/\bheat\s*\(/},

{id:'f_styled',st:'f',src:'xh',label:'有格式的 Excel（ExcelJS）：表格樣式、凍結窗格、列印設定、原生圖表、公式',
 how:'用 ExcelJS 組活頁簿：真正的「表格」並套自訂樣式、凍結表頭、欄寬自動、列印設定（A4、跨頁重複表頭）；18天工具另把畫面圖表做成 Excel 原生圖表。',
 pit:'ExcelJS 檔案很大：18天工具把 ExcelJS／JSZip 壓縮後內嵌在 <script type=\"text/plain\">，第一次按匯出才解壓載入，平時不佔效能。Excel 打開顯示「檔案損壞」多半是 XML 順序錯。',
 ref:{x:'xlBuild()／xlLoadLibs()',h:'buildXlsx()／fixXlsx()'},det:/ExcelJS/},
{id:'f_ods',st:'f',src:'h',label:'ODS 匯出（給用 LibreOffice／政府格式的人），格式與 Excel 一致',
 how:'欄寬、列高、表頭對齊、隔列底色、群組列都與 Excel 版相同；加同名資料庫範圍；匯入也支援 .ods。',
 pit:'ODS 有規則運算式時 LibreOffice 會跳警告，要避開。',ref:{h:'buildOds()'},det:/opendocument/},
{id:'f_stamp',st:'f',src:'h',label:'蓋章／簽核欄：勾選才出現，Excel／ODS／PDF 同步',
 how:'畫面一個勾選框；勾了就在報表最下方加核章欄位，三種格式一致；匯入舊檔時自動判斷原本有沒有蓋章欄。',ref:{h:'stamp()／sign()'},det:/蓋章欄/},
{id:'f_pack',st:'f',src:'s',label:'匯出「資料包」給下一支工具（下游工具讀這份，不重算規則）',
 how:'把下一支工具需要的資料（名冊、責任店、全部店家、座標、等級、應訪次數、各通路效率係數、排除名單）存成 gzip JSON，帶 format 與版本號。',
 pit:'包裡有真名與員編，檔名與說明要提醒不可直接外流。',ref:{s:'svAllocPackExport()'},det:/svAllocPackExport/},
{id:'f_copy',st:'f',src:'cxslrv',label:'一鍵複製純文字（核發清單、跟催清單、摘要、LINE 全文／精簡、任務），可貼給 LINE、財務或另一個網站',
 how:'把目前結果整理成固定格式的純文字，按一下複製到剪貼簿；單列也可單獨複製。複製失敗退回選取文字讓使用者手動複製。LINE 分享文字分「全文／精簡」兩種，各層級（總覽、單店）都有。',
 pit:'剪貼簿在 file:// 與部分瀏覽器會被擋，要有退路；若複製的是要給另一個網站讀的任務，提醒「複製後先不要再複製別的東西」。',ref:{c:'複製核發清單文字',x:'複製摘要',l:'copyPayload()'},det:/clipboard\.writeText|💬\s*LINE|LINE\s*全文|LINE\s*分享/},
{id:'f_handoff',st:'f',src:'sa',label:'交接清單（換手清單）CSV：每家店「原負責人 → 新負責人」，可下載此所或全部',
 how:'選定方案後列出每人換出／換入家數與逐店原→新，下載 CSV 給主管執行。',ref:{a:'⬇ 換手清單',s:'最小異動＋換手清單'},det:/換手/},
{id:'f_bookmarklet',st:'f',src:'l',label:'產生「書籤小程式」到來源網站批次下載（失敗重試、無資料略過、寫進指定資料夾、可續跑）',
 how:'本工具把任務（分段網址）複製到剪貼簿；使用者在來源網站點書籤，書籤載入下載器面板：按「開始」選資料夾，逐一下載、檔名加單位與日期、回 500 視為無資料略過、逾時重試、連續失敗自動暫停；下載紀錄寫在該資料夾，再按「開始」只抓沒完成的。另有 Console 貼上版當備援。下載檔名從伺服器回應標頭取得，遇到亂碼先修正編碼；同一網址算出固定識別碼，避免不同篩選條件被誤判為已下載；可「先試跑 1 個檔」。',
 pit:'書籤只能在指定網站執行（先檢查網址）；Console 版要先手打 allow pasting。下載器程式放在 <script type=\"text/plain\"> 當範本，與本工具程式分開維護。',ref:{l:'buildBookmarklet()／buildDownloaderScript()'},det:/buildBookmarklet/},
{id:'f_bat',st:'f',src:'l',label:'下載完自動關機的批次檔（.bat）',
 how:'下載器正常跑完才在資料夾寫入 _ALL_DONE.txt；批次檔偵測到就倒數 60 秒關機；試跑、手動停止、登入過期、連續失敗都不關機。',
 pit:'.bat 常被瀏覽器或防毒擋下，要提供「複製批次檔內容」自己另存；提醒取消方式 shutdown /a 與睡眠設定。',ref:{l:'buildBatText()'},det:/shutdown/},
{id:'f_diag',st:'f',src:'p',label:'診斷快照 JSON（給除錯用：設定、彙總、重點人員的原始列）',
 how:'輸出區一顆「🧩 快照」：匯出目前設定、人員彙總、異常與備查明細、重點人員的原始列，交給維護者重現問題。',
 pit:'含原始資料，匯出前要套用去識別化或提醒使用者。',ref:{p:'🧩 快照'}},

/* ---- v07 新增：第二輪逐函式盤點（十二支工具的全部函式與畫面按鈕逐一對照）後補上的元件 ---- */
{id:'z_compat',st:'z',src:'cxhsa',label:'舊存檔與舊設定相容：讀到舊格式不壞，退回預設並提示',
 how:'存檔、規則組、快照、資料包都帶格式版本號；讀入時先看版本：新版直接用、舊版轉換、無法轉換的欄位退回系統預設並提示「哪些設定沒帶過來」。換了儲存鍵（例：規則組 v1→v2）時保留讀舊鍵的程式。',
 pit:'舊程式打不開新格式是常態，要在匯出時註明；資料結構大改時寧可換新的儲存鍵，也不要讓新舊格式混在同一個鍵裡。',ref:{c:'deserializeRewardItems()／legacyTierType()',s:'svSnapDecode()（fmt:2）',a:'alloc-tool-*-v1 儲存格式'}},
{id:'a_checklist',st:'a',src:'xspc',label:'資料清單與缺漏提示：必要／選填各要哪些檔、已匯入幾筆、期間、還缺什麼',
 how:'匯入區或資料管理頁列一張表：資料名稱、必要或選填、要含哪些欄位、用在哪些功能、目前狀態（尚未匯入／筆數＋起訖日）；缺必要檔時在畫面上方提示，並說明缺了哪些功能會不準。',
 pit:'提示要告訴使用者「下一步做什麼」（去哪裡下載、檔名長怎樣），不要只寫「缺少資料」。',ref:{x:'importGuide()（可匯入資料一覽）',s:'getCriticalMissing()',p:'renderFl()（未放）',c:'renderPendingStatus()'},det:/importGuide|getCriticalMissing/},
{id:'a_supplement',st:'a',src:'s',label:'選填補充資料：依「員編＋日期」併入主資料（例：卡鐘刷卡、請假）',
 how:'補充檔各自解析成「員編＋日期」索引，再貼到主畫面的時段圖、日誌、工作天計算上；員編兩邊同時去前導 0 與小數點再比對；請假依起迄展開成每一天。缺補充檔時功能照常，只是少了那一層資訊。',
 pit:'用員編比對、不要用姓名（同名同姓會對錯人）；共用帳號沒有員編，對不到就不畫。欄位判斷要「先整格相同、再包含」，否則「請假人員」會被「請假人員編」吃掉。',ref:{s:'processCardTimeFiles()／processLeaveFiles()／cardTimeCodeKey()'},det:/cardTimeCodeKey|processLeaveFiles/},
{id:'a_prep',st:'a',src:'s',label:'原始檔前處理小工具：依營業處拆檔、整個資料夾的 xlsx 轉 CSV',
 how:'選一個資料夾，逐檔讀入後依營業處分組，各存成一個 CSV 寫回原資料夾（或另存）；也可整批把 xlsx 轉成 CSV，讓大檔讀得更快、方便分給各處。',
 pit:'寫回資料夾要用 showDirectoryPicker（僅 Chrome／Edge），不支援時改成逐檔下載；CSV 一律加 BOM。',ref:{s:'convertFolderSplitByBranch()／convertFolderToCsv()'},det:/convertFolderSplitByBranch|convertFolderToCsv/},
{id:'a_paste',st:'a',src:'l',label:'貼上文字匯入：貼網址、貼網頁原始碼、或從剪貼簿讀入任務清單',
 how:'提供一個文字框或「重新讀取剪貼簿」按鈕；從貼上的內容解析出需要的東西（例：問卷管理頁原始碼裡的所有問卷連結與分類，列成清單讓使用者點選套用）。',
 pit:'讀剪貼簿需要使用者授權、頁面要在前景；失敗時改成讓使用者手動貼上，不要靜默失敗。',ref:{l:'parseSurveyListHtml()／pullClipboard()'},det:/parseSurveyListHtml|pullClipboard/},

{id:'c_staffid',st:'c',src:'psdgawrh',label:'人員身分正規化：「姓名-員編」拆解、去離職星號、同名靠員編區分',
 how:'所有人員欄位進來先做同一套處理：去掉開頭的 *、＊ 與空白；尾端「-純數字」才算員編（＝訪員），其餘（主管、共用帳號、單位虛擬帳號如 1005）一律非訪員；程式內部一律以員編當身分鍵，姓名只用於顯示；同名同姓時顯示加員編區分。',
 pit:'這是各工具共用的定義，寫成一個共用函式（例：cleanStaffName／extractStaffCode／isStaffCode），不要每個畫面自己寫一次正規表示式；改了要全工具一起改。',ref:{p:'cs()',s:'cleanStaffName()／extractStaffCode()／isStaffCode()／svPersonKey()'},det:/isStaffCode|cleanStaffName|extractStaffCode/},
{id:'c_storeclass',st:'c',src:'psg',label:'店家分類規則：處所、臨時點、室內／室外點、非主要通路，各自影響哪些判定',
 how:'集中一處判定：店名含「臨時」＝臨時點（優先）；店家型態屬其他類別且店名含營業處／營業所／商化所＝處所；室內點／室外點另列；再依店家型態對到主要通路。每種分類在各樣態的處理寫成一張對照表（例：處所逾四小時列備查、不算衛星訊號異常）。',
 pit:'判斷順序要寫死且有註解（臨時優先）；各工具的同名函式要同口徑（例：isOfficeLikeName）。',ref:{s:'isOfficeLikeName()／isTempPointStoreName()／refChanOf()',p:'refChan()／isOth()'},det:/isOfficeLikeName|isTempPointStoreName/},
{id:'c_anomaly',st:'c',src:'psg',label:'打卡異常判定：八種異常類型＋備查分級＋兩段門檻',
 how:'同一人同一天的拜訪依時間排序後判定：不足一分、逾四小時、時間重疊、隔三小時、同店連打（以上標在後一筆）、衛星訊號異常、定位偏移、臨時點異地離站。打卡異常報表的列要以「員編＋時間（±1 秒）」比對回工作管理的同一筆任務，對不上整筆排除。可設「每人 ≤N1 排除、N1～N2 列備查、超過 N2 列異常」兩段門檻；量販、即飲、處所逾四小時改列備查。',
 pit:'規則來源只有一個（儀表板），檢核工具只加門檻；單位要講清楚：異常類型算「項」、拜訪算「筆」，一筆可有多項。不要在畫面上說「沒有異常」，改說「未命中異常類型」。',ref:{p:'analyze()／acode()',s:'classifyCheckinAnomaly()／computeGapState()／classifyOverlap()／showAbnormalCheckinModal()／abnormalBuildStats()',g:'RULE（答案卷）'},det:/classifyCheckinAnomaly|computeGapState/},
{id:'c_achieve',st:'c',src:'s',label:'各通路達成規則各自獨立（例：CVS 兩個月沒查才算未達成、連鎖超市依次數門檻）',
 how:'每個通路一個達成函式，回傳每家店的達成狀態；共用的只有資料來源與彙總，判定規則不硬抽成一個萬用函式。戰情看板的達成統計、主表格、匯出共用同一份結果。',
 pit:'不同通路規則看起來相似，強行合併會讓某通路的特例污染其他通路。',ref:{s:'buildCvsTrackerData()／computeSupermarketAchievement()／computeThresholdAchievements()'},det:/computeSupermarketAchievement|buildCvsTrackerData/},
{id:'c_calendar',st:'c',src:'s',label:'工作日曆：週末、國定假日、應上班日，並提示「疑似國定假日」',
 how:'全公司參數填國定假日；應上班日＝當月扣掉週末與國定假日；若某平日全公司拜訪量異常低，提示可能是漏填的國定假日；週末與假日的拜訪另計。',ref:{s:'svWlrHolidaySet()／svWlrIsWorkday()／svWlrSuspectHolidays()'},det:/SuspectHolidays|HolidaySet/},
{id:'c_travel',st:'c',src:'s',label:'直線估車程：兩店之間的直線距離換算大約幾分鐘（參考值）',

 c:'CVS 菸品活動：依活動規則算每家店、每位業務員可領多少獎勵，並稽核缺照片、間隔不足。',h:'在網頁上直接填營業處人力調查表，自動加總檢查，輸出漂亮的 Excel／ODS／PDF。',
 a:'營業所主管在地圖上圈店、點人，重新分配店家給業務員，即時看每人負荷。',d:'把真實原始檔的人名、員編換掉，才拿去測試或交給別人。',g:'產生像真的假原始檔與答案卷，用來測試其他工具。',
 o:'彙整缺貨通報問卷，看每週各營業處缺最多的品項。',w:'估算每個營業所的人力與店家配置，比較通路制與區域制誰比較平均。',l:'把長日期切成好幾段，到報表網站自動排隊下載。'};
const WIDS=new Set(WQ.flatMap(q=>q.o.flatMap(o=>o[4])));
function wzApply(){S.wz=S.wz||{};const on=[];for(const id of WIDS){const v=WQ.some(q=>q.o.some(o=>S.wz[o[0]]&&o[4].includes(id)));setOn(id,v);if(v)on.push(id)}addNeeds(on);save()}
function wzFromTool(k){S.wz={};for(const q of WQ)for(const o of q.o){const n=o[4].filter(m=>CATBY[m]&&CATBY[m].src.includes(k)).length;if(n&&n*2>=o[4].length)S.wz[o[0]]=1}wzApply();renderWz();toast('已帶入「'+TOOLS[k].name+'」的做法，可以再調整')}
function wzSample(){S.proj.name='業務員拜訪檢核工具';S.proj.purpose='每月檢查業務員有沒有按規定拜訪店家，產出給主管看的檢核報表。';S.proj.users='督導每月底開會投影；營業處主管自行下載報表。';
 S.wz={};['i_xl','i_auto','c_fmt','c_dup','c_mix','c_rule','c_sum','d_geo','d_find','d_dt','e_num','e_tab','e_tr','f_xl','f_zp','u_pj'].forEach(i=>S.wz[i]=1);wzApply();renderWz();toast('已填入範例，照你的情況改就好')}
function wzSummary(){const L=[],P=S.proj;L.push('【'+(P.name||'（還沒取名的工具）')+'】');if(P.purpose)L.push('用途：'+P.purpose);if(P.users)L.push('誰會用：'+P.users);
 for(const q of WQ){const c=q.o.filter(o=>S.wz&&S.wz[o[0]]);if(c.length){L.push('',q.t.replace(/^[①-⑥] /,''));c.forEach(o=>L.push('・'+o[1]+'：'+o[2]))}}return L.join('\n')}
function renderWz(){
  const p=$('#p-wz');p.innerHTML='';S.wz=S.wz||{};
  p.append(h('div',{class:'card wzhero'},h('h2',{style:'margin:0 0 6px'},'三步驟：回答問題 → 看摘要 → 交給 AI 開發'),
    h('div',{class:'mut'},'不用懂程式。只要用白話選出「你想要的樣子」，下面會即時整理成一份你看得懂的摘要；確認沒問題，再產出給 AI 的開發需求書。'),
    h('div',{class:'cardfoot'},h('button',{class:'btn pri',onclick:wzSample},'填入範例給我看'))));
  const det=h('details',{class:'help',style:'margin:10px 0'},h('summary',{},'不知道要選什麼？看看我們做過的 '+TK.length+' 支工具'));
  det.append(h('div',{class:'wgrid'},TK.map(k=>h('div',{class:'card'},h('h3',{style:'margin:0 0 4px'},TOOLS[k].name),h('div',{class:'meta'},WINTRO[k]),
    h('div',{class:'cardfoot'},h('button',{class:'btn',onclick:()=>wzFromTool(k)},'我想做類似的'),h('button',{class:'btn',onclick:()=>{goTab('an')}},'看詳細解析'))))));
  p.append(det);
  p.append(h('h2',{class:'sec'},'工具基本資料'),h('div',{class:'card form'},
    field('工具名稱',()=>S.proj.name,v=>{S.proj.name=v;save();wzSum()},{ph:'例：業務員拜訪檢核工具'}),
    field('用途（一兩句話）',()=>S.proj.purpose,v=>{S.proj.purpose=v;save();wzSum()},{area:1,wide:1,ph:'這支工具要解決什麼問題？誰會看結果？'}),
    field('誰會用、在什麼情況用',()=>S.proj.users,v=>{S.proj.users=v;save();wzSum()},{area:1,wide:1,ph:'例：督導每月底開會投影'})));
  for(const q of WQ){p.append(h('h2',{class:'sec'},q.t,h('small',{},'可複選，不需要的就不選')));
    p.append(h('div',{class:'wgrid'},q.o.map(o=>{const c=h('input',{type:'checkbox'});c.checked=!!S.wz[o[0]];
      c.addEventListener('change',()=>{c.checked?S.wz[o[0]]=1:delete S.wz[o[0]];wzApply();lb.classList.toggle('on',c.checked);wzSum()});
      const lb=h('label',{class:'wopt'+(c.checked?' on':'')},c,h('span',{},h('b',{},o[1]),h('span',{class:'wd'},o[2]),o[3]?h('small',{},o[3]):null));return lb})))}
  p.append(h('div',{class:'mut',style:'margin-top:10px'},'已自動包含基本款：單檔網頁、資料不上傳、版號管理、內建說明書、檔頭開發紀錄等，不用另外選。'));
  p.append(h('h2',{class:'sec'},'你的工具會長這樣（白話摘要）'),h('div',{class:'card'},h('pre',{id:'wzsum',class:'wzsum'}),
    h('div',{class:'cardfoot'},h('button',{class:'btn',onclick:()=>navigator.clipboard.writeText(wzSummary()).then(()=>toast('已複製摘要'),()=>toast('複製失敗，請手動選取'))},'複製摘要（給同事確認）'),
      h('button',{class:'btn pri',onclick:()=>goTab('out')},'產出給 AI 的需求書 →'),h('button',{class:'btn',onclick:()=>goTab('pick')},'想逐項微調 →'))));
  wzSum()}
function wzSum(){const e=$('#wzsum');if(e)e.textContent=wzSummary()}

/* ================= 啟動 ================= */
function reset(){if(!confirm('要清除目前所有勾選與填寫的內容嗎？（上傳解析結果也會清掉）'))return;S=fresh();UP=[];save();renderAnalyze();goTab('wz');toast('已清除')}
function init(){
  $('#ver').textContent=VER;restore();navH();window.addEventListener('resize',navH);buildTabs();renderAnalyze();goTab('wz');
  $('#btnReset').addEventListener('click',reset);
  $('#htmlIn').addEventListener('change',e=>{addHtml([...e.target.files]);e.target.value=''});
  $('#jsonIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());const s=j&&j.S;if(!s||!s.sel||!s.proj)throw 0;fixAlias(s.sel);S=Object.assign(fresh(),s);
      for(const id of Object.keys(S.sel))if(!CATBY[id])delete S.sel[id];save();goTab('pick');toast('已載入存檔')}catch(err){toast('這不是本工具的存檔 JSON')}});
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('.drop'))e.preventDefault()}));
}
init();
