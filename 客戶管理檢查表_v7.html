<style>
/* Layout: 單欄作業台。匯入列 → 固定頁籤＋進度 → 目前頁籤的修正清單（每家店一張卡片）。米黃色系。 */
:root{

}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn.primary:hover:not(:disabled){filter:brightness(1.1)} .btn:disabled{opacity:.45;cursor:not-allowed} .btn.sm{padding:3px 10px;font-size:.85rem} .btn.lg{padding:10px 20px;font-size:1rem}

.chip{font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.mute{background:var(--surface2);color:var(--muted)} .chip.sm{font-size:.68rem;padding:0 7px}
.tbl{overflow-x:auto;max-width:100%} .tbl.tall{max-height:64vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:700;position:sticky;top:0}
.num{text-align:right;font-family:var(--font-mono)} th.num{font-family:var(--font-body)}
tr.sub td{background:var(--surface2);font-weight:700}
.lt td{padding:5px 11px} .lv{font-family:var(--font-mono);font-weight:700;padding:0 8px;border-radius:5px;background:var(--surface2)}
.lv.s{background:var(--ok-bg);color:var(--ok)} .lv.a{background:var(--err-bg);color:var(--err)} .chg{margin-left:8px;font-size:.72rem;color:var(--warn);font-weight:700}
.flds{display:flex;flex-wrap:wrap;gap:12px} .fld{display:flex;flex-direction:column;gap:3px;min-width:min(280px,100%);flex:1 1 280px}
.fld label{font-size:.8rem;color:var(--muted);font-weight:700} .cur{font-size:.85rem;color:var(--muted)} .bad{color:var(--err);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .chips .lbl{font-size:.82rem;color:var(--muted)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px;font-family:var(--font-mono);font-size:.85rem}
.chipbtn:hover{border-color:var(--accent)} .chipbtn small{margin-left:6px;font-family:var(--font-body);color:var(--muted)}
.hintline{margin:0;font-size:.84rem;color:var(--muted)} .warnline{color:var(--warn)}
.gc-msg{display:flex;flex-direction:column;gap:2px;font-size:.86rem}
.m.ok{color:var(--ok)} .m.warn{color:var(--warn)} .m.err{color:var(--err)}
.gc-acts{display:flex;gap:8px;flex-wrap:wrap}
mark.ws{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px;font-family:var(--font-mono)}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;padding:10px;color:var(--muted);font-size:.88rem}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.warnc{color:var(--warn)!important}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 18px 14px;padding:0;list-style:none;counter-reset:s}
.flow li{counter-increment:s;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.88rem;color:var(--muted)}
.flow li b{display:block;color:var(--ink)} .flow li b::before{content:counter(s) ". "}
.panel>.tbl{margin:0 0 4px} .foot{margin:8px 18px;color:var(--muted);font-size:.84rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:8px 18px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column}
.stats b{font-family:var(--font-mono);font-size:1.5rem;font-weight:500} .stats span{font-size:.8rem;color:var(--muted)}
.exp-acts{display:flex;flex-wrap:wrap;gap:10px;padding:8px 18px}
.panel>h3,.panel>#recheck,.panel>.steps,.panel>.hintline{margin-left:18px;margin-right:18px}
.panel>#recheck{margin-top:0} .steps{padding-left:22px} .steps li{margin:3px 0}
.warnbox{margin-top:12px;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem}
.warnbox ul{margin:6px 0 0;padding-left:20px}
.rw{display:grid;grid-template-columns:24px minmax(170px,1fr) minmax(240px,1.5fr) minmax(70px,auto);gap:6px 14px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0} .rw[data-status="done"]{background:var(--accent-soft)}
input.ck{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.who strong{overflow-wrap:anywhere} .xs{font-size:.8rem}
.fix{display:flex;flex-direction:column;gap:6px;min-width:0}
.ff{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .ff .in{flex:1 1 180px} .ff .bad{max-width:100%}
.rw{padding:3px 6px;align-items:center;gap:4px 12px;grid-template-columns:24px minmax(280px,1.2fr) minmax(420px,1.8fr) minmax(180px,1fr);font-size:.9rem}
.rw .in{padding:3px 8px} .rw input.ck{margin:0}
.fix{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 8px}
.ff{flex:1 1 260px;flex-wrap:nowrap} .ff .bad{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwh{display:grid;grid-template-columns:24px minmax(280px,1.2fr) minmax(420px,1.8fr) minmax(180px,1fr);gap:12px;padding:6px;margin:0 18px;background:var(--surface2);font-weight:700;font-size:.84rem}
#list{gap:0;padding:0 18px 6px} .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr{color:var(--muted)} .scope{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)} .scope .in{padding:2px 8px}
.tabs{overflow-y:hidden}
body.loaded{padding-block:10px 40px} body.loaded header{display:none} body.loaded .wrap{gap:8px}
.drop.compact{padding:8px 14px;border-width:1px} .drop.compact .meta b:first-child{font-size:1.05rem}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:10px 18px 4px} .phead .right{margin:0} .right .more{display:inline-block;margin:0 0 0 12px;vertical-align:top}
.toolbar{margin-top:4px;padding:6px 18px} .vm{font-size:.84rem;min-height:1.2em} .gc-head .vm{margin-left:auto}
.tip{margin-left:6px;color:var(--muted);cursor:help}
.more{margin-top:6px;font-size:.88rem;color:var(--muted)} .more summary{cursor:pointer}
.bulkset{display:flex;gap:6px;align-items:center;font-size:.88rem}
.gc[data-status="done"]{background:var(--accent-soft)}
@media (max-width:720px){.rw{grid-template-columns:24px 1fr}.rw .fix,.rw .vm{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.toolbar .in{width:100%}.phead{padding:14px 14px 4px}#list{padding-inline:12px}}
</style>
<div class="wrap">
  <header><h1>客戶檢查表</h1><p>匯入客戶資料 Excel，系統找出異常並給建議值；你確認修正後，直接下載符合系統格式的匯入檔。資料只在瀏覽器內處理，不會上傳。</p></header>
  <label id="drop" class="drop" for="file" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <div id="dropText"><strong>將客戶資料 Excel 拖曳到這裡</strong><br><span>或點擊選擇檔案（.xlsx / .xlsm / .xls，第一列為欄位標題）</span></div>
    <div id="dropMeta" class="meta" hidden></div><span id="reBtn" class="btn" hidden>重新匯入</span>
  </label>
  <input id="file" type="file" accept=".xlsx,.xlsm,.xls" hidden>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <section id="intro" class="intro"></section>
  <div class="sticky"><div id="tabs" class="tabs" role="tablist" hidden></div>
    <div id="prog" class="prog" hidden><div id="scope" class="scope" hidden></div><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div></div>
  <main id="pane"></main>

<script>
(function(){
// ===== 核心邏輯：規則、統計、修正群組、驗證、匯出（可在 Node 測試） =====
const COLS=["新增/更新/刪除","客戶ID","店家型態代碼","店家型態","店家代碼","店家名稱","通路別","店家標註","店家等級","店家所屬區域","店家地址","營業狀態","客戶名稱","客戶等級","客戶電話","客戶手機","拜訪頻率(月)","營業處代碼","營業處名稱","營業所/課","執行人員","是否顯示給所有業務員","其他聯絡方式","備註","緯度","經度"];
const REQUIRED=["店家型態","店家代碼","店家名稱","通路別","店家等級","店家所屬區域","營業狀態","客戶等級"];
const S=v=>v==null?null:String(v);
const has=(v,sub)=>S(v)!=null&&S(v).includes(sub);
const len=v=>S(v)==null?null:[...S(v)].length;
const neLen=(v,n)=>len(v)!==n;
const inList=(v,arr)=>arr.includes(S(v));
const BASE_EXCL_TYPE=["其他類別","室內點","店家型態","陌開即飲","室外點"];
const CHAIN=["CVS通路,","連鎖超市通路,","量販通路,"];
const REQ_LEN={"OK":10,"全家":12,"統一":12,"萊爾富":10,"全聯社":12,"美廉社":10};
const TRAD_LEVELS=["A","B","C","F","系統店A","系統店B","鋪貨商","菸酒專","五大A","五大B","五大C"];
const LEVELS=["CVS","CVST","連鎖超市A","連鎖超市B","連鎖超市C","量販A","量販B","量販C","A","B","C","F","系統店A","系統店B","鋪貨商","菸酒專","五大A","五大B","五大C","無分級"];
const chOK=r=>S(r["通路別"])!=null&&!inList(r["通路別"],["其他類別,","室內外點,"]);
const typeOK=r=>!inList(r["店家型態"],["其他類別","虛擬店家"]);

// 單列判斷（回傳 true = 有問題）。基礎篩選（營業中等）在 analyze 套用。
const PRED={
 "空白區域":r=>!inList(r["通路別"],["其他類別,","室內外點,"])&&!inList(r["店家型態"],["其他類別","虛擬店家","陌開即飲"])&&!has(r["店家所屬區域"],"-"),
 "特販代碼":r=>{
    if(!inList(r["通路別"],CHAIN))return false;
    const t=S(r["店家型態"]),c=r["店家代碼"];
    if(t in REQ_LEN){ if(neLen(c,REQ_LEN[t]))return true; if(S(c)==null||!has(c,"-"))return true; }
    if(S(c)!=null&&/[a-z]/.test(S(c)))return true;
    return false;},
 "傳統代碼":r=>{
    if(S(r["通路別"])!=="傳統通路,"||S(r["店家型態"])==="楓康超市")return false;
    const c=S(r["店家代碼"]);
    if(c==null||c==="")return true;
    if(!c.includes("-")||!["1","0"].includes(c[0]))return true;
    if([...c].length!==10&&c.split("-").length===2)return true;
    return false;},
 "餐酒代碼":r=>inList(r["通路別"],["即飲通路,","菸酒專,"])&&S(r["店家型態"])!=="陌開即飲"&&neLen(r["店家代碼"],11),
 "空白通路":r=>S(r["通路別"])==null&&S(r["店家型態"])!=null&&!has(r["店家型態"],"其他類別")&&!has(r["店家型態"],"虛擬店家"),
 "店家等級":r=>{
    if(!typeOK(r)||!chOK(r))return false;
    const ch=S(r["通路別"]),t=S(r["店家型態"])??"",lv=S(r["店家等級"]);
    if(ch.includes("CVS通路,")&&!["CVS","CVST","F"].includes(lv))return true;
    if(ch.includes("連鎖超市通路,")){
      if(t.includes("全聯")&&!["連鎖超市A","連鎖超市B","F"].includes(lv))return true;
      if(t.includes("美廉社")&&!["連鎖超市C","F"].includes(lv))return true;
      if(t.includes("家樂福超市")&&!["連鎖超市C","F"].includes(lv))return true;
      if(!t.includes("全聯")&&!t.includes("美廉社")&&!t.includes("家樂福超市")&&lv!=="F")return true;
    }
    if(ch.includes("傳統通路")&&!TRAD_LEVELS.includes(lv))return true;
    return false;},
 "客戶等級":r=>typeOK(r)&&chOK(r)&&S(r["客戶等級"])==="A",
 "店名空白":r=>S(r["店家型態"])!=="即飲通路"&&S(r["通路別"])!=="即飲通路,"&&
    (has(r["店家名稱"]," ")||has(r["店家代碼"]," ")||has(r["店家名稱"],"")||has(r["店家名稱"],"　")),
};
const RULES=[
 {key:"主訪人數",title:"主訪人數",kind:"leader",short:"每家店剛好 1 位主訪人",
  right:"每家店必須剛好有 1 位主訪人（客戶等級 S），其餘客戶一律為「-」。請在每家店的客戶清單裡選出主訪人，系統會自動把其他人改為「-」。"},
 {key:"店名空白",title:"店名空白",kind:"text",short:"名稱與代碼不可有空白",

const RULE_BY_KEY=Object.fromEntries(RULES.map(r=>[r.key,r]));

function analyze(rows){
  const base=rows.filter(r=>!inList(r["店家型態"],BASE_EXCL_TYPE)&&S(r["營業狀態"])==="營業中"&&!has(r["營業處名稱"],"總公司"));
  const out={};
  for(const k of Object.keys(PRED))out[k]=base.filter(PRED[k]);
  const b=base.filter(r=>S(r["店家型態"])!=="陌開即飲");
  const g=new Map();
  for(const r of b){const k=S(r["店家代碼"])??"\u0000null";let o=g.get(k);if(!o){o={rows:[],S:0,A:0};g.set(k,o);}o.rows.push(r);
    if(S(r["客戶等級"])==="S")o.S++; if(S(r["客戶等級"])==="A")o.A++;}
  const hasA=b.some(r=>S(r["客戶等級"])==="A");
  const res=[];
  for(const o of g.values()){const keep=hasA?(o.S!==1||o.A>0):(o.S!==1);if(keep)res.push(...o.rows);}
  out["主訪人數"]=res;
  return {base,out};
}

// ===== 統計（用來產生「建議值」） =====
const inc=(m,k,n=1)=>m.set(k,(m.get(k)||0)+n);
const mm=(m,k)=>{let x=m.get(k);if(!x){x=new Map();m.set(k,x);}return x;};
const topN=(m,n=3)=>m?[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n):[];
const codePrefix=c=>{const m=S(c)&&S(c).match(/^([0-9A-Za-z]{4})-/);return m?m[1]:null;};
const suoOf=r=>S(r["營業所/課"])??"";
function buildStats(base){
  const st={leaderByPrefix:new Map(),leaderBySuo:new Map(),tradBySuo:new Map(),tradByOffice:new Map(),
    wineBySuo:new Map(),wineMax:new Map(),chainShapes:new Map(),areaBySuo:new Map(),areaCount:new Map(),areaOffice:new Map(),
    chanByType:new Map(),channels:new Map(),codeIdx:new Map()};
  const stores=new Map();
  for(const r of base){
    const c=S(r["店家代碼"]);
    if(c!=null){let a=st.codeIdx.get(c);if(!a){a=[];st.codeIdx.set(c,a);}a.push(r._i);}
    const sk=c??"\u0000"+S(r["店家名稱"]);let a=stores.get(sk);if(!a){a=[];stores.set(sk,a);}a.push(r);
    const ch=S(r["通路別"]),ty=S(r["店家型態"]);
    if(ch&&!["其他類別,","室內外點,"].includes(ch)){inc(st.channels,ch);if(ty)inc(mm(st.chanByType,ty),ch);}
    const ar=S(r["店家所屬區域"]);
    if(ar&&ar.includes("-")){inc(st.areaCount,ar);inc(mm(st.areaBySuo,S(r["營業處名稱"])+"|"+suoOf(r)),ar);inc(mm(st.areaOffice,S(r["營業處名稱"])),ar);}
    if(ch==="傳統通路,"&&/^[01]\d{3}-\d{5}$/.test(c||"")){const p=c.slice(0,4);inc(mm(st.tradBySuo,suoOf(r)),p);inc(mm(st.tradByOffice,S(r["營業處名稱"])),p);}
    if((ch==="即飲通路,"||ch==="菸酒專,")&&/^\d{4}-[0-9A-Za-z]-\d{4}$/.test(c||"")){const p=c.slice(0,7);inc(mm(st.wineBySuo,suoOf(r)),p);const cur=st.wineMax.get(p);const suf=c.slice(8);if(!cur||suf>cur)st.wineMax.set(p,suf);}
    if(CHAIN.includes(ch)&&ty in REQ_LEN&&c&&!PRED["特販代碼"](r)){
      const shape=c.replace(/[A-Za-z]/g,"A").replace(/\d/g,"9");const mt=mm(st.chainShapes,ty);const o=mt.get(shape);if(o)o.n++;else mt.set(shape,{n:1,ex:c});}
  }
  for(const rs of stores.values()){
    const sr=rs.filter(r=>S(r["客戶等級"])==="S");
    if(sr.length===1){const r=sr[0],rep=S(r["執行人員"]);if(rep){const p=codePrefix(r["店家代碼"]);if(p)inc(mm(st.leaderByPrefix,p),rep);inc(mm(st.leaderBySuo,suoOf(r)),rep);}}
  }
  return st;
}

const PERSON=/-\d{5,}$/;
let GID=0;
function makeGroup(rule,rows,extra){
  const r0=rows[0];
  return Object.assign({id:"g"+(++GID),rule,kind:RULE_BY_KEY[rule].kind,rows,status:"pending",
    name:S(r0["店家名稱"])||"(無店名)",code:S(r0["店家代碼"])||"(無代碼)",
    chan:S(r0["通路別"])||"",type:S(r0["店家型態"])||"",area:S(r0["店家所屬區域"])||"",suo:S(r0["營業所/課"])||"",
    vals:{},fields:[],chips:[],notes:[],options:null},extra||{});
}
const cleanText=s=>String(s??"").replace(/[\s　-]/g,"");
const hasPUA=s=>/[-]/.test(String(s??""));

function suggestLeader(g){
  g.value=null;g.suggested=null;g.reason="";
  const sr=g.rows.filter(r=>S(r["客戶等級"])==="S");
  if(!sr.length)return;
  const nm=r=>(S(r["執行人員"])||"").trim();
  const kind=r=>{const p=nm(r);return !p||/^\d+$/.test(p)?0:PERSON.test(p)?2:1;}; // 0 數字人 1 有名字 2 有名字＋員編
  const uniq=a=>[...new Set(a.map(nm))];
  let c=sr,why="";
  if(c.some(r=>kind(r)>0)&&c.some(r=>kind(r)===0)){c=c.filter(r=>kind(r)>0);why="數字帳號與訪員並列，以訪員為準";}
  if(uniq(c).length>1&&c.some(r=>kind(r)===2)){const e=c.filter(r=>kind(r)===2);if(uniq(e).length===1){c=e;why="有員編的訪員優先";}}
  if(uniq(c).length!==1)return;
  if(!why&&c.length>1)why="同一人重複為 S，保留一筆";
  g.value=c[0]._i;g.suggested=c[0]._i;g.reason=why;
}

function buildGroups(model){

    return g;});
  G["傳統代碼"]=grp("傳統代碼").map(rows=>{

    const tail=(c.match(/(?<!\d)(\d{5})$/)||(S(r0["店家名稱"])||"").match(/(?<!\d)(\d{5})$/)||[])[1]||"";
    const pf=topN(st.tradBySuo.get(suoOf(r0)),4);const pf2=pf.length?pf:topN(st.tradByOffice.get(S(r0["營業處名稱"])),4);
    g.chips=pf2.map(([p,n])=>({label:p+"-",value:p+"-"+tail,hint:`${n} 家`}));
    g.vals["店家代碼"]=(pf2.length&&tail)?pf2[0][0]+"-"+tail:"";
    g.info=pf2.length?`同營業所（${suoOf(r0)||S(r0["營業處名稱"])}）常見代碼前綴：`+pf2.map(([p,n])=>`${p}（${n}家）`).join("、"):"";
    if(tail)g.notes.push(`已從原代碼／店名取出店號 ${tail}，前綴請確認。`);
    return g;});

    g.vals["店家代碼"]=sug!==c?sug:"";
    if(sug!==c&&sug.length<c.length)g.notes.push("建議值已移除尾端的分店碼，請確認不會與其他店重複。");
    const sh=st.chainShapes.get(t);const ex=topN(new Map([...(sh||new Map())].map(([k,v])=>[k,v.n])),2).map(([k])=>sh.get(k).ex);
    g.info=t in REQ_LEN?`${t}須為 ${REQ_LEN[t]} 碼`+(ex.length?`，正確代碼範例：${ex.join("、")}`:""):"";
    return g;});
  G["餐酒代碼"]=grp("餐酒代碼").map(rows=>{
    const r0=rows[0],c=S(r0["店家代碼"])||"";
    const g=makeGroup("餐酒代碼",rows,{issue:`店家代碼長度為 ${len(r0["店家代碼"])??0} 碼，應為 11 碼`});
    g.fields=["店家代碼"];
    const d=c.replace(/\D/g,"");
    g.vals["店家代碼"]=/^\d{9}$/.test(d)&&!/[^\d-]/.test(c)?`${d.slice(0,4)}-${d[4]}-${d.slice(5)}`:"";
    const p4=codePrefix(c);
    let pf=topN(st.wineBySuo.get(suoOf(r0)),4);
    if(p4){const same=[...st.wineMax.keys()].filter(k=>k.startsWith(p4+"-")).map(k=>[k,1]);if(same.length)pf=same.concat(pf.filter(([k])=>!k.startsWith(p4+"-"))).slice(0,4);}
    g.chips=pf.map(([p])=>({label:p+"-",value:p+"-",hint:st.wineMax.get(p)?`目前最大 ${st.wineMax.get(p)}`:""}));
    if(g.vals["店家代碼"])g.notes.push("建議值是把原代碼的數字重組為 ####-#-####，屬推測，請與系統核對。");
    g.info="格式 ####-#-####（11 碼），例如 1022-2-0131。流水號請依系統現有編號填寫。";
    return g;});
  // 選擇型
  const areaList=[...st.areaCount.entries()].sort((a,b)=>b[1]-a[1]).map(([a])=>a);
  G["空白區域"]=grp("空白區域").map(rows=>{
    const r0=rows[0];const g=makeGroup("空白區域",rows,{issue:`店家所屬區域「${S(r0["店家所屬區域"])||"空白"}」未依「營業處-營業所」設定`});
    g.fields=["店家所屬區域"];

    return g;});

    g.fields=["店家等級"];

// ===== 驗證 =====
const trial=(r,vals)=>Object.assign({},r,vals);
function dupOf(model,g,code){
  const ids=model.stats.codeIdx.get(code);if(!ids)return null;
  const mine=new Set(g.rows.map(r=>r._i));
  const other=ids.find(i=>!mine.has(i));
  return other==null?null:model.rows[other];
}
function validateGroup(model,g){
  const items=[];let ok=true;
  const err=t=>{items.push({level:"err",text:t});ok=false;},warn=t=>items.push({level:"warn",text:t}),good=t=>items.push({level:"ok",text:t});
  if(g.kind==="leader"){
    if(g.value==null){err("請選出這家店的主訪人");}
    else{const r=g.rows.find(x=>x._i===g.value);good(`主訪人：${S(r["執行人員"])||S(r["客戶名稱"])||"客戶 "+r["客戶ID"]}`);}
    return {ok,items};
  }
  const vals=g.vals,r0=g.rows[0];
  const t=trial(r0,vals);
  if(g.kind==="select"){
    const f=g.fields[0],v=vals[f];
    if(!v){err("請選擇一個值");return {ok,items};}
    if(g.options&&!g.options.includes(v)){err("此值不在可選清單內");return {ok,items};}
    if(PRED[g.rule](t))err("此值仍不符合規則");else good("符合規則");
    return {ok,items};
  }
  // text
  for(const f of g.fields){
    const v=vals[f]??"";
    if(!v.trim()){err(`請輸入${f}`);continue;}
    if(g.rule==="店名空白"){
      if(/[\s　-]/.test(v))err(`${f}不可含空白或特殊字元`);
    }
  }
  if(!ok)return {ok,items};
  if(g.rule==="店名空白"){
    if(PRED["店名空白"](t))err("仍含空白或特殊字元");else good("已無空白字元");
    return {ok,items};
  }
  const code=vals["店家代碼"];
  if(PRED[g.rule](t)){
    if(g.rule==="傳統代碼"){
      if(!code.includes("-"))err("需含「-」，格式 0000-00000");
      else if(!["0","1"].includes(code[0]))err("開頭須為 0 或 1");
      else err(`長度須為 10 碼（目前 ${[...code].length} 碼），格式 0000-00000`);
    }else if(g.rule==="特販代碼"){
      const ty=S(r0["店家型態"]);
      if(ty in REQ_LEN&&neLen(code,REQ_LEN[ty]))err(`${ty}須為 ${REQ_LEN[ty]} 碼（目前 ${[...code].length} 碼）`);
      if(ty in REQ_LEN&&!code.includes("-"))err("需含「-」");
      if(/[a-z]/.test(code))err("不可含小寫英文字母");
      if(ok)err("仍不符合規則");
    }else if(g.rule==="餐酒代碼"){
      err(`長度須為 11 碼（目前 ${[...code].length} 碼），格式 0000-0-0000`);
    }
    return {ok,items};
  }
  good("符合規則");
  if(g.rule==="傳統代碼"&&!/^[01]\d{3}-\d{5}(-\d{1,3})?$/.test(code))warn("通過規則，但不是標準格式 0000-00000，請再確認");
  if(g.rule==="餐酒代碼"&&!/^\d{4}-[0-9A-Za-z]-\d{4}$/.test(code))warn("通過規則，但不是標準格式 0000-0-0000，請再確認");
  const d=dupOf(model,g,code);
  if(d)warn(`代碼已被其他店家使用：${S(d["店家名稱"])||""}（客戶ID ${d["客戶ID"]}）`);
  return {ok,items};
}

function groupPatch(g){
  const P=[];
  if(g.kind==="leader"){
    for(const r of g.rows){const nv=r._i===g.value?"S":"-";if(S(r["客戶等級"])!==nv)P.push([r,{"客戶等級":nv}]);}
  }else{
    for(const r of g.rows){const d={};for(const f of g.fields){const nv=g.vals[f];if(nv!=null&&nv!==""&&S(r[f])!==nv)d[f]=nv;}if(Object.keys(d).length)P.push([r,d]);}
  }
  return P;
}
function compilePatches(model){
  const patches=new Map(),log=[],seen=new Set();
  for(const rule of RULES.map(r=>r.key)){
    for(const g of model.groups[rule]||[]){
      if(g.status!=="done"||seen.has(g.id))continue;seen.add(g.id);
      for(const [r,d] of groupPatch(g)){
        const cur=patches.get(r._i)||{};
        for(const f of Object.keys(d)){log.push({rule:g.rule,row:r,field:f,from:r[f],to:d[f]});cur[f]=d[f];}
        patches.set(r._i,cur);
      }
    }
  }
  return {patches,log};
}
function applyPatches(rows,patches){return rows.map(r=>patches.has(r._i)?Object.assign({},r,patches.get(r._i)):r);}

function templateWorkbook(ExcelJS,rows,lists){
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("匯入範例");
  const font=(sz,b)=>({name:"微軟正黑體",size:sz,bold:!!b});
  ws.columns=COLS.map(()=>({width:18}));
  const h=ws.getRow(1);COLS.forEach((c,i)=>{const cell=h.getCell(i+1);cell.value=c;cell.font=font(11,true);});
  h.getCell(1).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFDC35"}};
  rows.forEach((r,ri)=>{
    const row=ws.getRow(ri+2);
    COLS.forEach((c,i)=>{const v=c==="新增/更新/刪除"?"更新":r[c];if(v!=null&&v!==""){const cell=row.getCell(i+1);cell.value=v;cell.font=font(10,false);}});
  });
  const ns=wb.addWorksheet("newSheet");
  ["A","B","C","D","E","F"].forEach((L,ci)=>(lists[L]||[]).forEach((v,ri)=>{ns.getCell(ri+1,ci+1).value=v;}));
  const last=Math.max(2,rows.length+1);
  const dv=(col,L,n)=>ws.dataValidations.add(`${col}2:${col}${last}`,{type:"list",allowBlank:true,formulae:[`newSheet!$${L}$1:$${L}$${n}`]});
  dv("A","C",lists.C.length);dv("L","F",lists.F.length);dv("S","A",lists.A.length);dv("U","B",lists.B.length);dv("V","D",lists.D.length);
  return wb;
}
function logWorkbook(ExcelJS,log){

const OFF_ORDER=["北部","桃園","臺中","嘉義","臺南","高雄","花蓮"];
const offRank=n=>{const t=String(n??"").replace(/台/g,"臺");const i=OFF_ORDER.findIndex(k=>t.includes(k));return i<0?99:i;};
const cmp=(a,b)=>String(a).localeCompare(String(b),"en",{numeric:true});
const minSuo=g=>g.rows.map(r=>S(r["營業所/課"])||"").sort(cmp)[0]||"";
function sortGroups(G){for(const k of Object.keys(G))G[k].sort((x,y)=>{const a=x.rows[0],b=y.rows[0];
  return offRank(a["營業處名稱"])-offRank(b["營業處名稱"])||cmp(S(a["營業處名稱"])||"",S(b["營業處名稱"])||"")||cmp(minSuo(x),minSuo(y))||cmp(x.code,y.code);});}
function buildModel(rows){
  rows.forEach((r,i)=>{r._i=i;});
  const {base,out}=analyze(rows);const stats=buildStats(base);
  const model={rows,base,out,stats};model.groups=buildGroups(model);sortGroups(model.groups);return model;
}

async function exportFile(kind){
  let downloads=null;try{downloads=await window.claude?.use?.("downloads");}catch(e){}
  if(typeof ExcelJS==="undefined"){setStatus("匯出元件尚未載入，請稍後再試。",true);return;}
  const {patches,log}=compilePatches(ST.model);
  const d=new Date(),ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  try{
    let wb,name;
    if(kind==="import"){const rows=[...patches.keys()].sort((a,b)=>a-b).map(i=>Object.assign({},ST.model.rows[i],patches.get(i)));wb=templateWorkbook(ExcelJS,rows,TPL_LISTS);name=`客戶資料匯入_${ymd}.xlsx`;}
    else{wb=logWorkbook(ExcelJS,log);name=`客戶資料修正紀錄_${ymd}.xlsx`;}
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    if(downloads)await downloads.save({filename:name,data:blob});
    else{const a=document.createElement("a");const u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
    setStatus(`已儲存 ${name}`);
  }catch(e){if(e&&e.code==="declined")setStatus("已取消儲存。");else setStatus("匯出失敗："+(e&&e.message||e),true);}
}

    let ok=0;for(const g of filtered(ST.tab)){if(g.status!=="pending"||!g.options||!g.options.includes(v))continue;g.vals[g.fields[0]]=v;if(validateGroup(ST.model,g).ok){g.status="done";ok++;}}
    setStatus(`已套用 ${fmt(ok)} 項。`);renderRule(ST.tab);renderTabs();}
});

  touched(x.g,x.el);}
document.addEventListener("keydown",e=>{
  const t=e.target.closest(CELL);if(!t)return;const row=t.closest(".rw");if(!row)return;
  if(e.key==="Enter"||(t.tagName==="INPUT"&&(e.key==="ArrowDown"||e.key==="ArrowUp"))){
    const n=e.key==="ArrowUp"?row.previousElementSibling:row.nextElementSibling;
    if(n&&n.classList.contains("rw")){const f=n.querySelector(CELL);if(f){e.preventDefault();f.focus();if(f.select)f.select();}}return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){
    const p=row.previousElementSibling;if(!p||!p.classList.contains("rw"))return;
    const i=[...row.querySelectorAll(CELL)].indexOf(t),src=p.querySelectorAll(CELL)[i];if(!src)return;
    e.preventDefault();setCell(t,src.value);}
});
document.addEventListener("paste",e=>{
  const t=e.target.closest("input[data-field]");if(!t)return;
  const lines=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\r/g,"").split("\n");
  if(lines.length&&lines[lines.length-1]==="")lines.pop();
  if(lines.length<2)return;
  e.preventDefault();let row=t.closest(".rw");const k=[...row.querySelectorAll("input[data-field]")].indexOf(t);
  for(const ln of lines){if(!row||!row.classList.contains("rw"))break;const f=row.querySelectorAll("input[data-field]")[k];if(f)setCell(f,ln.split("\t")[0].trim());row=row.nextElementSibling;}
});

// ---- 匯入 ----
async function handleFile(file){
  if(!file)return;
  setStatus("讀取檔案中…");await tick();
  try{
    const buf=await file.arrayBuffer();
    setStatus(`解析 Excel 中…（${(buf.byteLength/1048576).toFixed(1)} MB，筆數多時需要數秒）`);await tick();
    const wb=XLSX.read(buf,{type:"array",dense:true,cellText:false,cellDates:false});
    let aoa=null;
    for(const name of wb.SheetNames){
      const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
      if(a.length&&a[0]&&REQUIRED.every(c=>a[0].map(x=>String(x??"").trim()).includes(c))){aoa=a;break;}
    }
    if(!aoa){const first=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null,blankrows:false})[0]||[];
      throw new Error("找不到客戶資料欄位。缺少："+REQUIRED.filter(c=>!first.map(x=>String(x??"").trim()).includes(c)).join("、")+"（第一列需為標題列）");}
    setStatus("套用檢查規則、產生建議值中…");await tick();
    const head=aoa[0].map(x=>String(x??"").trim()),idx=COLS.map(c=>head.indexOf(c));
    const rows=new Array(aoa.length-1);
    for(let i=1;i<aoa.length;i++){const a=aoa[i],o={};for(let j=0;j<COLS.length;j++){const v=idx[j]<0?null:a[idx[j]];o[COLS[j]]=(v===""||v===undefined)?null:v;}rows[i-1]=o;}
    const model=buildModel(rows);
    ST.model=model;ST.scopes={};ST.fileName=file.name;ST.tab="overview";ST.filter={};ST.page={};ST.search={};ST.sel.clear();
    ST.gmap=new Map();for(const g of uniqueGroups())ST.gmap.set(g.id,g);
    $("drop").classList.add("compact");$("dropText").hidden=true;$("dropMeta").hidden=false;$("reBtn").hidden=false;
    const bad=RULES.filter(r=>ruleGroups(r.key).length>0).length;
    document.body.classList.add("loaded");$("dropMeta").innerHTML=`<b>客戶檢查表</b><span class="fname">${esc(file.name)}</span><span>匯入 <b>${fmt(rows.length)}</b> 筆</span><span>納入檢查 <b>${fmt(model.base.length)}</b> 筆</span><span>有異常的項目 <b>${bad}</b> / ${RULES.length}</span>`;
    $("intro").hidden=true;setStatus("");renderScope();
    renderTabs();renderPane();
  }catch(err){setStatus("匯入失敗："+(err&&err.message||err),true);}
}
const drop=$("drop"),input=$("file");
input.addEventListener("change",()=>{handleFile(input.files[0]);input.value="";});
drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click();}});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop"||!e.relatedTarget)drop.classList.remove("over");}));
document.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f);});
$("intro").innerHTML=`<p class="muted" style="margin:0">匯入後自動檢查：${RULES.map(r=>esc(r.title)).join("、")}</p>`;
renderTabs();

})();
</script>
