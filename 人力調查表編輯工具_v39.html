<style>

const DEF=['傳統','CVS','連鎖超市','量販','啤鋪','菸鋪','烈酒'], TYPES=['','綜合所','商化所','開單所'];

const LOG=[[39,'2026-10-28',['更新提示改為「直接下載」：按一下就把新版存到下載資料夾，不再跳到 GitHub 英文網頁；下載失敗時在提示條上說明並可重試']],[38,'2026-10-28',['含「室」單位的倉管人數欄改為完全空白（不再是灰底色塊）']],[37,'2026-10-28',['人力調查表：單位名稱含「室」者不需填倉管人數——該欄改為灰底不可輸入，計入總人數與 Excel／ODS／PDF 匯出時一律視為空白（原有數字會被清除）']],[36,'2026-10-28',['檢查更新改為自動掃描 GitHub 上的檔名（不再需要 version.json）：找出同名稱、版本號較大的檔案就提示；支援 _v8、_V05、V34 等各種版本寫法；同一台電腦 3 小時內只查一次']],[35,'2026-10-28',['開啟時自動到 GitHub（1061005ttl-lab/tool）檢查有無新版，有的話頂端顯示提示條，可前往下載、略過此版或稍後再說；查不到（離線、被擋）時靜默略過，不影響使用']],[34,'2026-10-28',['修正：拖曳調整列順序時，不再跳出「放開滑鼠，匯入檔案」的匯入提示（只有真正從外部拖入檔案才會顯示）']],[33,'2026-10-28',['三張表（人力調查表、訪員名單、櫃檯名單）的每一列都能調整順序：按「▲／▼」上下移動，或抓住「⠿」拖曳到目標列','有套用「篩選營業所/課」時，上移／下移只會跟同篩選內的相鄰列交換','移動後保留捲動位置']],[32,'2026-10-27',['訪員名單與櫃檯名單合併為同一頁籤「訪員／櫃檯名單」，左右併列、各自捲動，共用「篩選營業所/課」','合併後各欄重新調整欄寬；備註欄縮窄','畫面不再顯示「營業處」欄（匯出的 Excel／ODS／PDF 仍有）','「配對訪員」欄匯出改為純文字，不再使用公式','訪員所別非「所／行銷課」、櫃檯所別非「所」時，所別欄標紅並在頂端提醒','修正：櫃檯改名後，左側訪員的搭配櫃檯會同步更新；單位改名或刪除後，篩選自動回到「全部」']],[30,'2026-10-27',['櫃檯名單表新增「配對訪員」欄（依訪員的「搭配櫃檯」帶出；Excel／ODS 為公式，PDF 為匯出當下的值；匯入時忽略）','ODS 欄寬、列高、統計列字級、表頭對齊（首欄靠左、備註置中）與 Excel 一致；三個分頁補上第 2 列（長表頭／「人員資料」「負責通路」群組列），列配置與 Excel 一致；隔列底色起始列對齊','Excel 表格標題列固定為白字粗體藍底']],

[1,'2026-10-27',['初版：人力調查表／訪員名單／櫃檯名單三分頁']]];
const HIDE=['夜通'],OK={vis:/所|行銷課/,cnt:/所/};
function stripCh(st){const ix=(st.ch||[]).map((k,i)=>HIDE.includes(k)?i:-1).filter(i=>i>=0);if(ix.length){st.ch=st.ch.filter((k,i)=>!ix.includes(i));(st.vis||[]).forEach(v=>{if(v.ch)v.ch=v.ch.filter((x,i)=>!ix.includes(i))})}return st}
let CH=DEF.slice();
const PRESET=[['經理室'],['副理室'],['人事室'],['政風室'],['行政室'],['會計室'],['物流課'],['處倉'],['行銷課'],['A所','綜合所'],['B所','商化所'],['C所','開單所']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isSuo=n=>OK.cnt.test(n||'');
const noWh=n=>/室/.test(n||'');
const shown=(n,v)=>OK.vis.test(n)||v?v:'',N=v=>Number(v)||0, U=()=>({n:'',t:'',d:'',e:'',i:'',j:'',k:''});
let S=blank(), tab=0, filt='', armed=false;
function blank(){return{name:'XX',period:'115年10月',ch:DEF.slice(),units:PRESET.map(([n,t])=>({...U(),n,t:t||''})),vis:[],cnt:[],stamp:true}}
let SNAP=null;try{const e=document.getElementById('snap');if(e)SNAP=JSON.parse(e.textContent)}catch(e){}
const KEY=SNAP?'hc_snap_'+SNAP.time:'hc_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s);else if(SNAP&&SNAP.state)S=SNAP.state}catch(e){if(SNAP&&SNAP.state)S=SNAP.state}
S.ch=S.ch||DEF.slice();stripCh(S);CH=S.ch;
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)}

/* ---------- 計算 ---------- */
function calc(u){const f=(l,r)=>S[l].filter(x=>u&&x.u===u&&x.r===r).length;return{F:f('vis','督導兼訪員'),G:f('vis','訪員'),H:f('cnt','櫃檯')}}
function rowv(u){const c=calc(u.n);return{C:N(u.d)+N(u.e)+c.F+c.G+c.H+(noWh(u.n)?0:N(u.i))+N(u.j),D:N(u.d),E:N(u.e),...c,I:noWh(u.n)?0:N(u.i),J:N(u.j)}}
const pairs=i=>S.vis.filter(v=>v.c.includes(S.cnt[i].n));
const pairStr=c=>c.n?S.vis.filter(v=>v.n&&v.c.includes(c.n)).map(v=>v.n).join('、'):'';
function refresh(){
  if(tab==0){const T={};S.units.forEach((u,i)=>{const r=rowv(u);for(const k in r)T[k]=(T[k]||0)+r[k];for(const k of 'CFGH'){const e=document.querySelector(`[data-calc="${k}"][data-i="${i}"]`);if(e)e.textContent=k==='C'?r[k]:shown(u.n,r[k])}});
    document.querySelectorAll('[data-tot]').forEach(e=>e.textContent=T[e.dataset.tot]||0)}
  if(tab==1)document.querySelectorAll('[data-pair]').forEach(e=>{const p=pairs(+e.dataset.pair);e.textContent=p.length?p.length+'：'+p.map(v=>v.n).join('、'):'0'});
  warn();save()}
const nz=t=>String(t).replace(/[\s\u3000]/g,'').replace(/臺/g,'台');
const pre=n=>{n=String(n==null?'':n).trim();const p=String(S.name||'').trim();if(!n||!p||isSuo(n)||!/[室課]$/.test(n))return n;return nz(n).startsWith(nz(p))?n:p+n};
function remapU(o,n){if(o===n)return;S.vis.concat(S.cnt).forEach(x=>{if(x.u===o)x.u=n})}
function autoPrefix(){S.vis=S.vis||[];S.cnt=S.cnt||[];S.cnt.forEach(c=>{if(c.r==='__custom__'||c.r==='__del__'||!c.r)c.r='櫃檯'});S.units.forEach(u=>{const n=pre(u.n);if(n!==u.n){remapU(u.n,n);u.n=n}if(noWh(u.n))u.i=''})}
function renamePrefix(o,nw){o=String(o||'').trim();nw=String(nw||'').trim();if(!o||o===nw)return;const po=nz(o);
  S.units.forEach(u=>{if(isSuo(u.n)||!/[室課]$/.test(u.n))return;const m=String(u.n).replace(/[\s\u3000]/g,'');if(m.replace(/臺/g,'台').startsWith(po)){const n=nw+m.slice(po.length);remapU(u.n,n);u.n=n}})}
autoPrefix();
function matchU(x){const us=S.units.map(u=>u.n).filter(Boolean);if(!x)return null;if(us.includes(x))return x;
  const nx=nz(x),p=nz(S.name),st=t=>t.startsWith(p)?t.slice(p.length):t;
  let c=us.filter(u=>nz(u)===nx);if(!c.length)c=us.filter(u=>st(nz(u))===st(nx));
  if(!c.length)c=us.filter(u=>{const a=nz(u);return a.length>=2&&nx.length>=2&&(nx.endsWith(a)||a.endsWith(nx))});
  return c.length===1?c[0]:null}
function fixUnits(add){const fixed=[],added=[],seen={};
  for(const x of S.vis.concat(S.cnt)){if(!x.u||S.units.some(u=>u.n===x.u))continue;
    let m=seen[x.u]||matchU(x.u);
    if(!m&&add){S.units.push({...U(),n:x.u});added.push(x.u);m=x.u}
    if(m){if(!seen[x.u]){seen[x.u]=m;if(m!==x.u)fixed.push(x.u+'→'+m)}x.u=m}}
  return{fixed,added,msg:[fixed.length?'自動對應所別：'+fixed.join('、'):'',added.length?'自動新增單位：'+added.join('、'):''].filter(Boolean).join('；')}}
function warn(){const us=new Set(S.units.map(u=>u.n)),cs=new Set(S.cnt.map(c=>c.n)),w=[],bad={},miss=new Set(),seen=new Set();
  S.units.forEach(u=>{if(!u.n)w.push('有空白的單位名稱');else if(seen.has(u.n))w.push(`單位「${u.n}」重複`);seen.add(u.n)});

    settings.push(`<config:config-item-map-entry config:name="${X(t.name.slice(0,31))}"><config:config-item config:name="HorizontalSplitMode" config:type="short">2</config:config-item><config:config-item config:name="VerticalSplitMode" config:type="short">2</config:config-item><config:config-item config:name="HorizontalSplitPosition" config:type="int">${xs}</config:config-item><config:config-item config:name="VerticalSplitPosition" config:type="int">${ys}</config:config-item><config:config-item config:name="ActiveSplitRange" config:type="short">2</config:config-item><config:config-item config:name="PositionLeft" config:type="int">0</config:config-item><config:config-item config:name="PositionRight" config:type="int">${xs}</config:config-item><config:config-item config:name="PositionTop" config:type="int">0</config:config-item><config:config-item config:name="PositionBottom" config:type="int">${ys}</config:config-item></config:config-item-map-entry>`)});
  const NS='xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" xmlns:tableooo="http://openoffice.org/2009/table" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0" xmlns:of="urn:oasis:names:tc:opendocument:xmlns:of:1.2"';
  const auto=[...col].map(([k,n])=>`<style:style style:name="${n}" style:family="table-column"><style:table-column-properties style:column-width="${k}" fo:break-before="auto"/></style:style>`).join('')+
    [...row].map(([k,n])=>`<style:style style:name="${n}" style:family="table-row"><style:table-row-properties style:row-height="${k}" fo:break-before="auto" style:use-optimal-row-height="false"/></style:style>`).join('')+
    SH.map((_,i)=>`<style:style style:name="ta${i+1}" style:family="table" style:master-page-name="Default"><style:table-properties table:display="true" tableooo:tab-color="#2F5597"/></style:style>`).join('')+
    [...cstyles.values()].map(csXml).join('');
  const vx=vals.size?`<table:content-validations>${[...vals.values()].map(v=>`<table:content-validation table:name="${v.n}" table:condition="of:cell-content-is-in-list(${v.list.map(x=>'&quot;'+X(x)+'&quot;').join(';')})" table:allow-empty-cell="true" table:display-list="unsorted" table:base-cell-address="${X(SH[0].name.slice(0,31))}.A1"><table:error-message table:message-type="stop" table:display="${v.loose?'false':'true'}"/></table:content-validation>`).join('')}</table:content-validations>`:'';
  /* 資料庫範圍（ODS 最接近 Excel「表格」的東西）：名稱與 Excel 表格相同，表頭列顯示篩選下拉按鈕 */
  const TN=['人力調查表','訪銷員名單表','櫃檯名單表'],colL=n=>{let t='';n++;while(n>0){const m=(n-1)%26;t=String.fromCharCode(65+m)+t;n=Math.floor((n-1)/26)}return t};
  const qs=n=>/[^\p{L}\p{N}_]/u.test(n)?"'"+n.replace(/'/g,"''")+"'":n;
  const dbx=SH.map((t,si)=>{const nd=t.rows.length-(si===0?1:0);if(nd<1)return '';const sn=qs(t.name.slice(0,31)),hr=si===0?4:3;
    return `<table:database-range table:target-range-address="${X(sn)}.A${hr}:${X(sn)}.${colL(t.head.length-1)}${hr+nd}" table:name="${TN[si]}" table:display-filter-buttons="true"/>`}).join('');
  const content=`<?xml version="1.0" encoding="UTF-8"?><office:document-content ${NS} office:version="1.2"><office:automatic-styles>${auto}</office:automatic-styles><office:body><office:spreadsheet><table:calculation-settings table:case-sensitive="false" table:search-criteria-must-apply-to-whole-cell="true" table:use-wildcards="true" table:use-regular-expressions="false" table:automatic-find-labels="false"/>${vx}${tabs.join('')}${dbx?`<table:database-ranges>${dbx}</table:database-ranges>`:''}</office:spreadsheet></office:body></office:document-content>`;
  const styles=`<?xml version="1.0" encoding="UTF-8"?><office:document-styles ${NS} office:version="1.2"><office:automatic-styles><style:page-layout style:name="pm1"><style:page-layout-properties fo:page-width="29.7cm" fo:page-height="21cm" style:print-orientation="landscape" fo:margin-top="1.2cm" fo:margin-bottom="1.2cm" fo:margin-left="1cm" fo:margin-right="1cm" style:table-centering="horizontal" style:scale-to-X="1" style:scale-to-Y="0"/><style:footer-style><style:header-footer-properties fo:min-height="0.5cm" fo:margin-top="0.2cm"/></style:footer-style></style:page-layout></office:automatic-styles><office:master-styles><style:master-page style:name="Default" style:page-layout-name="pm1"><style:footer><text:p fo:text-align="center">第 <text:page-number/> 頁，共 <text:page-count/> 頁</text:p></style:footer></style:master-page></office:master-styles></office:document-styles>`;
  const setx=`<?xml version="1.0" encoding="UTF-8"?><office:document-settings ${NS} office:version="1.2"><office:settings><config:config-item-set config:name="ooo:view-settings"><config:config-item-map-indexed config:name="Views"><config:config-item-map-entry><config:config-item config:name="ViewId" config:type="string">view1</config:config-item><config:config-item-map-named config:name="Tables">${settings.join('')}</config:config-item-map-named><config:config-item config:name="ShowGrid" config:type="boolean">false</config:config-item></config:config-item-map-entry></config:config-item-map-indexed></config:config-item-set></office:settings></office:document-settings>`;
  const man=`<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.spreadsheet"/><manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="settings.xml" manifest:media-type="text/xml"/></manifest:manifest>`;
  const z=new JSZip();z.file('mimetype','application/vnd.oasis.opendocument.spreadsheet',{compression:'STORE'});
  z.file('META-INF/manifest.xml',man);z.file('content.xml',content);z.file('styles.xml',styles);z.file('settings.xml',setx);
  return z.generateAsync({type:'arraybuffer',compression:'DEFLATE',mimeType:'application/vnd.oasis.opendocument.spreadsheet'})}

function snapHtml(){
  const c=document.documentElement.cloneNode(true);c.querySelectorAll('#snap').forEach(e=>e.remove());
  ['#main','#tabs','#warn','#msg','#ver','#upd'].forEach(q=>{const e=c.querySelector(q);if(e){e.innerHTML='';e.removeAttribute('class');e.removeAttribute('style')}});
  const d=c.querySelector('#drop');if(d)d.removeAttribute('style');
  const sc=document.createElement('script');sc.type='application/json';sc.id='snap';
  sc.textContent=JSON.stringify({app:'hc-manpower',ver:VER,time:new Date().toISOString(),state:S}).replace(/</g,'\\u003c');
  c.querySelector('script:not([src])').before(sc);
  return '<!DOCTYPE html>\n'+c.outerHTML}
const shortSuo=n=>String(n??'').replace(/營業所/g,'所');
/* 匯出用：單位名稱（含名單的所別）中的「營業所」簡化為「所」；只改匯出，不動畫面與快照 */
function shortState(r){return{...r,units:r.units.map(u=>({...u,n:shortSuo(u.n)})),vis:r.vis.map(v=>({...v,u:shortSuo(v.u)})),cnt:r.cnt.map(c=>({...c,u:shortSuo(c.u)}))}}
async function exportAs(kind){
  if(!S.units.length)return toast('請至少保留一個單位');
  const fx=fixUnits(true);render();const note=fx.msg?fx.msg+'。':'';
  const dl=(window.claude&&claude.use&&await claude.use('downloads'))||{save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data])),l=document.createElement('a');l.href=u;l.download=filename;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  const d=new Date(),ymd=String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),base=`${S.name}處所最新人力調查表_v${ymd}`;
  toast('產生檔案中⋯');
  const real=S,cut=kind!=='html'&&real.units.some(u=>/營業所/.test(u.n));if(kind!=='html')S=shortState(real);
  try{
    if(kind==='xlsx'){if(typeof ExcelJS==='undefined')return toast('Excel 元件載入失敗，請重新整理');await dl.save({filename:base+'.xlsx',data:await buildXlsx()})}
    else if(kind==='pdf'){await dl.save({filename:base+'.pdf',data:await (await pdfBlob()).arrayBuffer()})}
    else if(kind==='html')await dl.save({filename:base+'_快照.html',data:snapHtml()});
    else if(kind==='ods'){if(typeof JSZip==='undefined')return toast('ODS 元件載入失敗，請重新整理');
      const buf=await buildOds();
      try{await dl.save({filename:base+'.ods',data:buf})}catch(e){if(!e||e.code!=='rejected_extension')throw e;
        const z=new JSZip();z.file(base+'.ods',buf);await dl.save({filename:base+'_ods.zip',data:await z.generateAsync({type:'arraybuffer'})});return toast(note+'平台不允許直接下載 .ods，已打包成 zip，解壓即得 .ods（內容為數值，不含公式）')}}
    toast(note+(cut?'已將單位名稱中的「營業所」簡化為「所」。':'')+'已送出下載')
  }catch(e){if(e&&e.code==='declined')toast('已取消下載');else{console.error(e);toast('匯出失敗：'+(e.message||e))}}finally{S=real}}

/* ---------- 檢查更新：掃描 GitHub repo 根目錄的檔名，找同名稱、版本號更大的檔案 ----------
   檔名格式容許：名稱_v8.html／名稱_V05.html／名稱V34.html（v 大小寫皆可、底線可有可無、版本號可補 0）
   舊版請搬進子資料夾（例如 archive/），只掃描根目錄。 */
const UPD={raw:'https://raw.githubusercontent.com/1061005ttl-lab/tool/main/',api:'https://api.github.com/repos/1061005ttl-lab/tool/contents/',page:'https://github.com/1061005ttl-lab/tool',key:'人力調查表編輯工具',hours:3};
const upKey=t=>String(t).replace(/[\s　_\-]/g,'').toLowerCase();
const upParse=n=>{const m=String(n).match(/^(.+?)[v]0*(\d+)\.html?$/i);return m?{base:upKey(m[1]),ver:Number(m[2])}:null};
async function checkUpdate(){
  if(SNAP||!window.fetch)return;
  try{
    let best=null;const now=Date.now(),CK='hc_upd_cache';
    try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&now-c.t<UPD.hours*36e5)best=c.best||{ver:0}}catch(e){}
    if(!best){
      const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),6000);
      const r=await fetch(UPD.api,{signal:ac.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(tm);
      if(!r.ok)return;const list=await r.json();if(!Array.isArray(list))return;
      best={ver:0};
      for(const f of list){if(f.type!=='file')continue;const p=upParse(f.name);if(p&&p.base===upKey(UPD.key)&&p.ver>best.ver)best={ver:p.ver,name:f.name,url:f.html_url,dl:f.download_url}}
      try{localStorage.setItem(CK,JSON.stringify({t:now,best}))}catch(e){}}
    const nv=best.ver;if(!(nv>VER))return;
    let sk=0;try{sk=Number(localStorage.getItem('hc_skip'))||0}catch(e){}
    if(sk>=nv)return;
    const u=$('#upd');
    u.innerHTML=`<span class="t">🔔 有新版 <b>v${nv}</b>（目前 v${VER}）：${esc(best.name||'')}<br><span id="updMsg" style="color:var(--mu);font-size:12px">按「直接下載」會把新版存到下載資料夾，再改開新下載的檔案即可。若新版看不到舊資料，請先在這個版本按「快照」匯出，再到新版「匯入檔案」還原。</span></span><button class="p" id="updGo">直接下載</button><button id="updSkip">略過此版</button><button id="updLater">稍後再說</button>`;
    u.classList.add('on');
    $('#updGo').onclick=async e=>{const b=e.currentTarget,m=$('#updMsg');
      try{b.disabled=true;b.textContent='下載中…';
        const r=await fetch(best.dl||(UPD.raw+encodeURIComponent(best.name)),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
        const bl=new Blob([await r.blob()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=best.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
        b.textContent='已下載 ✓';m.textContent='已存到下載資料夾：'+best.name+'。請關掉這個頁面，改開新下載的檔案。若新版看不到舊資料，請先在這個版本按「快照」匯出，再到新版「匯入檔案」還原。'}
      catch(err){b.disabled=false;b.textContent='重試';m.textContent='下載失敗（可能是網路不穩，或公司網路擋住 GitHub），請稍後按「重試」。'}};
    $('#updSkip').onclick=()=>{try{localStorage.setItem('hc_skip',String(nv))}catch(e){}u.classList.remove('on')};
    $('#updLater').onclick=()=>u.classList.remove('on');
  }catch(e){/* 離線、被擋或超過查詢次數：靜默略過 */}}

render();
checkUpdate();
</script>
