<!DOCTYPE html>
<!--
================================================================
工具需求規格產生器｜開發紀錄（給後續 AI 助手／維護者先讀這一段）
現行版本：v04（2026-10-14）
改版必做：版號多處一起改——①檔名 ②<title> ③畫面 h1 的 #ver ④程式 const VER ⑤檔案最上方「版本紀錄」註解 ⑥本註解。
================================================================
【用途】把已經做好的單檔 HTML 工具，拆成「匯入 → 讀取原始資料 → 解析與清洗 → 篩選 → 排版 → 匯出」六個階段的功能模組，讓使用者勾選、補充指定，輸出下一支工具的開發需求書。
【結構】單檔、純前端、不連網、不依賴任何外部程式庫（所以沒有 cdnjs 問題）。三個分頁：①解析現有工具（內建六支工具的白話解析＋上傳 HTML 自動偵測＋功能對照表）②指定需求（基本資料、資料來源、六階段勾選、業務規則／口徑／輸出欄位）③產出需求書（Markdown，可複製、下載、存成 JSON 再載入）。
【功能目錄 CAT】每個模組有 id、階段 st、來源 src（p＝打卡異常檢核工具 V70、x＝全聯18天銷售分析工具 v39、q＝問卷照片檢視工具 v193、s＝督導管理系統 執行追蹤儀表板 v390、r＝patrol_board 節慶巡補看板 1.55.1、v＝coverage_board 覆蓋率看板 3.17.0，是人工讀程式後標的）、做法 how、踩坑 pit、參考函式 ref、偵測規則 det（正規表示式）。新增模組只要在 CAT 加一筆；det 沒寫就不會被自動偵測，但仍可手動勾選。
【自動偵測 analyzeHtml】先把 <script src> 外連與內嵌大型程式庫（開頭是授權橫幅、超過 30KB）切出去，只對「工具自己的程式與 HTML」套 det；偵測前先去掉 HTML 註解與 /*…*/ 註解，避免開發紀錄裡提到的字被算進去。偵測結果是字串特徵推測，不是語意分析，畫面上已標示「請人工確認」。
【驗證方式】用 node 載入 CORE 區塊，對原始檔跑 analyzeHtml，逐項比對 src 與偵測結果；v02 只拿到 q、s 兩支原始檔，p、x 的對照仍是 v01 的結論（v02 改動的四條 det 沒有用 p、x 原檔重跑，下次拿到原檔要補驗）；v02 對 q、s 跑出的結果已逐項比對 src；沒有特徵可偵測的項目（單檔 HTML、名詞對照表等）以人工標註為準。改 CAT 或 det 後要重跑。
【踩過的坑】
  - 打卡工具的開發紀錄註解裡寫了 haversine，實際程式用的是 Math.asin(Math.sqrt()) 與 12742000；det 以程式為準。
  - 打卡工具的 .seg 是匯出對話框的格式選擇，不是篩選；d_chips 只認 class="chips"。
  - 打卡工具的 type="date" 在「下載區間」對話框，不是資料篩選；d_date 改認 mFrom／cutoff／ytd。
  - 18天工具沒有說明書、沒有檔頭開發紀錄；z_manual、z_notes 只標 p。
  - 問卷工具的 window.open('') 是開列印視窗不是下載捷徑；classifyDupPair 是重複照片分類不是檔案辨識；JSZip 用在讀 xlsx 不是匯出 ZIP；toISOString().slice(0,10) 不是表頭列偵測——這四條 det 已收緊；另外 analyzeHtml 去註解的方式改成只剝「前面是空白或符號」的 /*…*/ 與 // 行註解（舊寫法遇到字串裡的 /* 會把一大段程式吃掉，造成 PptxGenJS 這類真的存在的做法偵測不到、也讓註解裡的 window.open() 被算進去）。
  - 督導工具靠「檔名」分流、不靠表頭；它的 showDirectoryPicker 是「依營業處拆分來源檔」小工具用的，不是記住資料夾；DecompressionStream 是還原靜態副本用的，不是讀 .gz。
  - r、v 兩支都依賴同資料夾的 shared/*.js 與 shared/dashboard-common.css，這些檔案沒有拿到，所以它們「匯出、照片牆、逐題彙整、彙整看板」的實作細節只能依主檔裡的呼叫與說明推測，標在對照表上的 ✓ 只代表主檔有用到。
  - r、v 的 d_keep 偵測會誤中（localStorage 只用在登入檢查），src 不標。
【v04 白話層】WQ（問答選項）→ 對應模組 id 清單 → wzApply() 只改動「WQ 有涉及的模組」的勾選，不動其他模組的手動勾選。新增白話選項只要在 WQ 加一筆 [id,標題,說明,例子,[模組id]]。WINTRO 是六支工具的一句話介紹。wzFromTool 以「該選項的模組有一半以上屬於某工具」推算套用，不需另外維護。白話文字不放函式名稱與技術名詞。
【未決／可做】上傳 JSON（存檔）時尚未檢查版本相容；可考慮加「從需求書反推缺少的模組」。
================================================================
-->

<header class="top">

<script>
// ==CORE==
/* 階段定義：z 是共通規範，a～f 對應「匯入 → 讀取 → 解析 → 篩選 → 排版 → 匯出」 */
const STAGES=[
 {id:'z',name:'共通規範',hint:'整支工具都要遵守的規矩'},
 {id:'a',name:'匯入',hint:'檔案怎麼進來'},
 {id:'b',name:'讀取原始資料',hint:'檔案怎麼變成一列一列的資料'},
 {id:'c',name:'解析與清洗',hint:'原始列怎麼變成可分析的資料'},
 {id:'d',name:'篩選',hint:'使用者怎麼縮小範圍'},
 {id:'e',name:'排版',hint:'畫面怎麼呈現'},
 {id:'f',name:'匯出',hint:'結果怎麼帶走'}
];
const TOOLS={p:{k:'p',name:'打卡異常檢核工具',ver:'V70',short:'打卡 V70'},x:{k:'x',name:'全聯18天銷售分析工具',ver:'v39',short:'18天 v39'},q:{k:'q',name:'問卷照片檢視工具',ver:'v193',short:'問卷 v193'},s:{k:'s',name:'督導管理系統 執行追蹤儀表板',ver:'v390',short:'督導 v390'},r:{k:'r',name:'節慶巡補看板 patrol_board',ver:'1.55.1',short:'巡補 1.55'},v:{k:'v',name:'覆蓋率看板 coverage_board',ver:'3.17.0',short:'覆蓋 3.17'}};
const TK=['p','x','q','s','r','v'];

/* 功能目錄。src：p＝打卡異常檢核工具 V70、x＝全聯18天 v39、q＝問卷照片檢視 v193、s＝督導管理系統 v390、r＝巡補看板 1.55.1、v＝覆蓋率看板 3.17.0 有。
   det：用來在「上傳的 HTML」裡找特徵的正規表示式（字串特徵推測，需人工確認）。ref：各工具裡可以回頭看的函式。 */
const CAT=[
/* ---- 共通規範 ---- */

/* ---------- 解析一份 HTML 工具 ---------- */
const LIBNAMES=[[/xlsx|sheetjs/i,'SheetJS'],[/chart\.js|chart\.umd|chart\.min/i,'Chart.js'],[/html2canvas/i,'html2canvas'],[/jszip/i,'JSZip'],[/jspdf/i,'jsPDF'],[/papaparse/i,'PapaParse'],[/lodash/i,'lodash'],[/d3(\.|@|\/)/i,'d3'],[/tailwind/i,'Tailwind'],[/leaflet/i,'Leaflet'],[/echarts/i,'ECharts']];
function libName(s){for(const [re,n] of LIBNAMES)if(re.test(s))return n;return null}
function libVer(s){const m=s.match(/(?:v|@|\/|\s)(\d+\.\d+(?:\.\d+)?)/);return m?m[1]:''}
function splitCode(html){
  const libs=[];let own='',last=0,emb=0;const re=/<script([^>]*)>([\s\S]*?)<\/script>/gi;let m;
  while((m=re.exec(html))){
    own+=html.slice(last,m.index);last=m.index+m[0].length;
    const a=m[1],b=m[2],src=(a.match(/src\s*=\s*["']([^"']+)["']/)||[])[1];
    if(src){const ext=/^(https?:)?\/\//i.test(src);libs.push({n:libName(src)||src.split('/').pop(),v:libVer(src),local:!ext,how:ext?'外連 '+(src.match(/\/\/([^/]+)/)||[])[1]:'同資料夾檔案，不是單檔'});continue}
    if(/type\s*=\s*["']text\/plain["']/i.test(a)){emb+=b.length;continue}
    const head=b.slice(0,500);
    if(b.length>30000&&/^\s*\/\*!?/.test(head)&&(libName(head)||/license|copyright|\(c\)|\bmit\b/i.test(head))){
      libs.push({n:libName(head)||'內嵌程式庫',v:libVer(head),how:'內嵌（約 '+Math.round(b.length/1024)+' KB）'});continue}
    own+=b+'\n';
  }
  own+=html.slice(last);
  return {own,libs,emb};
}
function countRe(re,s){const f=re.flags.replace('g','')+'g';return (s.match(new RegExp(re.source,f))||[]).length}
function pickCols(code){

  re=/\.(?:has|includes)\(\s*['"]([^'"\n]{1,30})['"]\s*\)/g;while((r=re.exec(code)))add(r[1]);
  re=/colIdx\(\s*\w+\s*,\s*([^)]*)\)/g;while((r=re.exec(code))){(r[1].match(/'[^']+'|"[^"]+"/g)||[]).forEach(x=>add(x.slice(1,-1)))}

function analyzeHtml(text,name){

  const code=own.replace(/<!--[\s\S]*?-->/g,'').replace(/(^|[\s;{},()=:])\/\*[\s\S]*?\*\//g,'$1').replace(/(^|[\s;{},)])\/\/[^\n]*/g,'$1');

  {const mm=(own.match(/@@模組：/g)||[]).length;if(mm)feats.z_modules=mm}  /* 模組標籤寫在 // 行註解裡，去註解後會消失，所以另外數 */
  {const ext=libs.filter(l=>!l.local).length,loc=libs.length-ext;if(ext)feats.z_cdn=ext;if(loc)feats.z_shared=loc}
  const ctl={select:countRe(/<select|h\(\s*'select'/,code),date:countRe(/type\s*[:=]\s*["']date["']/,code),search:countRe(/type\s*[:=]\s*["']search["']/,code),number:countRe(/type\s*[:=]\s*["']number["']/,code),checkbox:countRe(/type\s*[:=]\s*["']checkbox["']/,code),radio:countRe(/type\s*[:=]\s*["']radio["']/,code),file:countRe(/type\s*[:=]\s*["']file["']/,code),button:countRe(/<button|h\(\s*'button'/,code)};
  const tabs=[];const tm=code.match(/id="tabs"[^>]*>([\s\S]*?)<\/nav>/);if(tm)for(const b of tm[1].matchAll(/<button[^>]*>([^<]+)<\/button>/g))tabs.push(b[1].trim());
  const ex=new Set();for(const b of code.matchAll(/['"`>]([^'"`<>\n]{0,10}(?:匯出|下載|截圖|備份|還原)[^'"`<>\n]{0,12})['"`<]/g)){const t=b[1].trim();if(t&&t.length<=14&&!/不是|怎麼用|失敗|中…|已|請/.test(t))ex.add(t)}
  const notes=comments.map(c=>({head:c.split('\n')[0].slice(0,60),text:c}));
  const sections=[...new Set(comments.join('\n').match(/【[^】]{1,14}】/g)||[])];

    fnCount:countRe(/function\s+\w+/,code)};
}

async function addHtml(files){
  let n=0;
  for(const f of files){
    if(!/\.html?$/i.test(f.name)){toast('只能解析 .html 檔：'+f.name);continue}
    toast('解析中：'+f.name);await new Promise(r=>setTimeout(r,30));
    try{const t=await f.text();const a=analyzeHtml(t,f.name);const i=UP.findIndex(u=>u.name===f.name);if(i>=0)UP[i]=a;else UP.push(a);n++}catch(e){toast('讀取失敗：'+f.name)}
  }
  if(n){renderAnalyze();toast('已解析 '+n+' 個檔案')}
}

['e_tr','樹狀展開表','處 → 所 → 人，可一層層展開。','',['e_tree']],
['e_ch','圖表','長條圖、折線圖等。','',['e_chart','e_trend']],
['e_pv','交叉分析表','自己選列、欄、數值，像 Excel 樞紐。','',['e_pivot']],
['e_mp','地圖','店家分布與當日拜訪路線。','',['e_map']],
['e_tl','時段圖／月曆','一天內到店與離店時段，或一個月每天的出勤。','',['e_gantt','e_calendar']],
['e_ph','照片牆','縮圖列表，點開看大圖並左右切換。','',['e_gallery']],
['e_tb','分頁切換','不同角度的結果分成幾個分頁。','',['e_tabs','e_toolbar']]]},
{t:'⑤ 結果要怎麼帶走？',o:[
['f_xl','下載 Excel','多分頁、欄寬與數字格式都排好。','',['f_xlsx','f_name']],
['f_cs','下載 CSV','純資料，拿去別處再加工。','',['f_csv']],
['f_pd','PDF 或網頁報表','方便寄送、列印。','',['f_pdf','f_html']],
['f_zp','一次出很多份（打包）','一個處一份、一個所一份、一個人一份，打包下載。','',['f_zip','f_dialog']],
['f_sh','畫面截圖','存成圖片，或直接貼到簡報、LINE。','',['f_shot']],
['f_pp','簡報檔（PPTX）','照片或報表自動排進簡報。','',['f_pptx']],
['f_ln','LINE 文字','整理成一段文字，一鍵複製後貼 LINE。','',['f_line','f_detail']]]},
{t:'⑥ 還有哪些使用情境？',o:[
['u_pj','會拿去投影或列印','版面清楚、底色不失真，A4 可直接印。','',['e_print']],
['u_mb','會用手機看','版面自動適應手機螢幕。','',['e_mobile']],
['u_ed','產出後想直接修改','報表可直接改字，有復原。','',['e_edit']]]}];
const WINTRO={p:'每月檢查業務員打卡有沒有異常（太晚、離店太遠…），產出給主管看的彙總與明細。',x:'匯入訂單與調查資料，分析 18 天檔期各營業處的業績與同期比較。',q:'匯入附照片的問卷，檢視照片、找出重複使用的照片，並輸出報告。',s:'看業務員每天的拜訪執行狀況：時段、地圖、月曆。',r:'節慶期間追蹤各店巡補次數有沒有達標，資料讀自 Google 試算表。',v:'看各店覆蓋狀況（已有／已知無／待確認），並做跨分支比較。'};
const WIDS=new Set(WQ.flatMap(q=>q.o.flatMap(o=>o[4])));
function wzApply(){S.wz=S.wz||{};for(const id of WIDS){const on=WQ.some(q=>q.o.some(o=>S.wz[o[0]]&&o[4].includes(id)));setOn(id,on)}save()}
function wzFromTool(k){S.wz={};for(const q of WQ)for(const o of q.o){const n=o[4].filter(m=>CATBY[m]&&CATBY[m].src.includes(k)).length;if(n&&n*2>=o[4].length)S.wz[o[0]]=1}wzApply();renderWz();toast('已帶入「'+TOOLS[k].name+'」的做法，可以再調整')}
function wzSample(){S.proj.name='業務員拜訪檢核工具';S.proj.purpose='每月檢查業務員有沒有按規定拜訪店家，產出給主管看的檢核報表。';S.proj.users='督導每月底開會投影；營業處主管自行下載報表。';
 S.wz={};['i_xl','i_auto','c_fmt','c_dup','c_mix','c_rule','c_sum','d_geo','d_find','d_dt','e_num','e_tab','e_tr','f_xl','f_zp','u_pj'].forEach(i=>S.wz[i]=1);wzApply();renderWz();toast('已填入範例，照你的情況改就好')}
function wzSummary(){const L=[],P=S.proj;L.push('【'+(P.name||'（還沒取名的工具）')+'】');if(P.purpose)L.push('用途：'+P.purpose);if(P.users)L.push('誰會用：'+P.users);
 for(const q of WQ){const c=q.o.filter(o=>S.wz&&S.wz[o[0]]);if(c.length){L.push('',q.t.replace(/^[①-⑥] /,''));c.forEach(o=>L.push('・'+o[1]+'：'+o[2]))}}return L.join('\n')}
function renderWz(){
  const p=$('#p-wz');p.innerHTML='';S.wz=S.wz||{};
  p.append(h('div',{class:'card wzhero'},h('h2',{style:'margin:0 0 6px'},'三步驟：回答問題 → 看摘要 → 交給 AI 開發'),
    h('div',{class:'mut'},'不用懂程式。只要用白話選出「你想要的樣子」，下面會即時整理成一份你看得懂的摘要；確認沒問題，再產出給 AI 的開發需求書。'),
    h('div',{class:'cardfoot'},h('button',{class:'btn pri',onclick:wzSample},'填入範例給我看'))));
  const det=h('details',{class:'help',style:'margin:10px 0'},h('summary',{},'不知道要選什麼？看看我們做過的 6 支工具'));
  det.append(h('div',{class:'wgrid'},TK.map(k=>h('div',{class:'card'},h('h3',{style:'margin:0 0 4px'},TOOLS[k].name),h('div',{class:'meta'},WINTRO[k]),
    h('div',{class:'cardfoot'},h('button',{class:'btn',onclick:()=>wzFromTool(k)},'我想做類似的'),h('button',{class:'btn',onclick:()=>{goTab('an')}},'看詳細解析'))))));
  p.append(det);
  p.append(h('h2',{class:'sec'},'工具基本資料'),h('div',{class:'card form'},
    field('工具名稱',()=>S.proj.name,v=>{S.proj.name=v;save();wzSum()},{ph:'例：業務員拜訪檢核工具'}),
    field('用途（一兩句話）',()=>S.proj.purpose,v=>{S.proj.purpose=v;save();wzSum()},{area:1,wide:1,ph:'這支工具要解決什麼問題？誰會看結果？'}),
    field('誰會用、在什麼情況用',()=>S.proj.users,v=>{S.proj.users=v;save();wzSum()},{area:1,wide:1,ph:'例：督導每月底開會投影'})));
  for(const q of WQ){p.append(h('h2',{class:'sec'},q.t,h('small',{},'可複選，不需要的就不選')));
    p.append(h('div',{class:'wgrid'},q.o.map(o=>{const c=h('input',{type:'checkbox'});c.checked=!!S.wz[o[0]];
      c.addEventListener('change',()=>{c.checked?S.wz[o[0]]=1:delete S.wz[o[0]];wzApply();lb.classList.toggle('on',c.checked);wzSum()});
      const lb=h('label',{class:'wopt'+(c.checked?' on':'')},c,h('span',{},h('b',{},o[1]),h('span',{class:'wd'},o[2]),o[3]?h('small',{},o[3]):null));return lb})))}
  p.append(h('div',{class:'mut',style:'margin-top:10px'},'已自動包含基本款：單檔網頁、資料不上傳、版號管理、內建說明書、檔頭開發紀錄等，不用另外選。'));
  p.append(h('h2',{class:'sec'},'你的工具會長這樣（白話摘要）'),h('div',{class:'card'},h('pre',{id:'wzsum',class:'wzsum'}),
    h('div',{class:'cardfoot'},h('button',{class:'btn',onclick:()=>navigator.clipboard.writeText(wzSummary()).then(()=>toast('已複製摘要'),()=>toast('複製失敗，請手動選取'))},'複製摘要（給同事確認）'),
      h('button',{class:'btn pri',onclick:()=>goTab('out')},'產出給 AI 的需求書 →'),h('button',{class:'btn',onclick:()=>goTab('pick')},'想逐項微調 →'))));
  wzSum()}
function wzSum(){const e=$('#wzsum');if(e)e.textContent=wzSummary()}

/* ================= 啟動 ================= */
function reset(){if(!confirm('要清除目前所有勾選與填寫的內容嗎？（上傳解析結果也會清掉）'))return;S=fresh();UP=[];save();renderAnalyze();goTab('wz');toast('已清除')}
function init(){
  $('#ver').textContent=VER;restore();navH();window.addEventListener('resize',navH);buildTabs();renderAnalyze();goTab('wz');
  $('#btnReset').addEventListener('click',reset);
  $('#htmlIn').addEventListener('change',e=>{addHtml([...e.target.files]);e.target.value=''});
  $('#jsonIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const j=JSON.parse(await f.text());const s=j&&j.S;if(!s||!s.sel||!s.proj)throw 0;S=Object.assign(fresh(),s);
      for(const id of Object.keys(S.sel))if(!CATBY[id])delete S.sel[id];save();goTab('pick');toast('已載入存檔')}catch(err){toast('這不是本工具的存檔 JSON')}});
  ['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('.drop'))e.preventDefault()}));
}
init();

</script>
