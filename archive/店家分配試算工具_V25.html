        （試算時三重橘色 121%）；改成把量販量當起始負荷（init）。
  V21 修正最小異動（使用者：三峽明顯是區域制、好好的，選最小異動卻讓 963114 出現飛地，反而更糟）：
      原因①容許範圍 ±10%（三峽平均 92% → 約 ±9 點）比負荷 % 本身的誤差（±10～15 點）還窄，三峽 79～105% 其實在誤差內也被搬。
      原因②smCmpMin 只配對「最忙×最閒」，兩人地盤不相鄰也硬搬：375809 的店離他自己的店 0.1 公里、離 963114 卻 1.8～2.5 公里，搬過去就成飛地。
      ①容許範圍改 ±15%（MIN_TOL，smCmpMin 與 smTidy 共用）。
      ②smCmpMin 改寫：每一步在所有（給的人、收的人、店）裡挑「店離收的人最近的店 ≤ max(1 公里, 2×離給的人其他店)」的邊界店；
        給的人超出上限或收的人低於下限才搬；只能由高往低、搬完不交叉、不把人推出範圍；不相鄰的兩人經由中間的人一棒一棒傳；找不到邊界店就停（剩下的由主管決定）。
      ③現況已在範圍內（最小異動 0 家）時，不再出現「◎ 先用最小異動」。
      ④smTidy 只清理「最小異動造成的」孤立／越界店：現況原本就那樣的店不動；最小異動一家都沒搬就不整理（三峽 0 家）。
      ⑤鄰居距離依所的疏密：max(1 公里, 3×最近店距離中位數)。
      ⑥沒有店的人（新人）先從最忙的人地盤邊緣、周圍有店的那家拿一家當起點，再照鄰居規則往外長。
        已知限制：鄉下所（竹東、恆春、玉里）新人只長到 13～16%；要讓新人分到正常的量，改選「依區域」或主管圈選。
      全台 56 所（與 V19 比）：最小異動「新造成」的孤立／越界店 808 → 216 家（中位 9.5 → 2）；換手中位 33 → 42 家；6 所不動。
        落差仍 >25 點的所多是所內有負荷極低的特殊人員（龍潭 6%、斗六 1%／8%、蘆洲 10%、花蓮 12%、玉里 10%），不相鄰就不硬塞。
      本函式源自儀表板 smCmpMin，V21 起與儀表板不同，接回時以本工具為準。
  V22 🔒 鎖定（使用者：某業務員的店就是不更動，要能鎖住、只動其他人）：沿用引擎原本的「排除人員」（svAllocExcl，localStorage alloc-tool-excl-v1，V07 時拿掉了畫面）。
      ①卡片 🔓／🔒（同 ⏱ ✕ 滑鼠移上去才出現；鎖定後常駐顯示 🔒、卡片變淡、小字「🔒 鎖定」）。
      ②系統分法（最小異動、區域、通路、混合）與補位：他的店不動、不分店給他（引擎 slots 不含他、fixed 保留他的店）。
      ③手動：圈選、點選選不到他的店；選好店點他的卡片不會指派（assignTo 也擋）；鎖定當下已選的他的店會自動取消。
      ④最忙／最閒與比較表不含他；ⓘ 比較框註明「已鎖定 N 人（名單），表內數字不含他們」。
      引擎（svAlloc*）未動。
  V23 修正單人檢視的地盤（使用者截圖：點名字只看 838945，他在三重東邊的店大片沒上色、只剩虛線框）：
      原因：地盤每格只塗「最近那家店」的負責人，單人檢視只畫「最近的店剛好是他」的格子；他的店跟別人交錯的地方，最近的店多半是別人的，整片就空掉。
      改成單人檢視時用「他自己的店」畫完整地盤（店家 TERR_HL_BUF＝0.45 公里內，比全員模式 0.8 公里貼近店家），
      格子裡也有別人的店（在格內）＝混合格（虛線）＝跟別人重疊的地方。全員模式不變。
  V24 店點也看得出通路（使用者同意的方向：顏色已被「人」用掉，同一個點不能有兩套顏色；外框已用於選取與量販、大小已用於量販與非主要）：
      ①多人模式：填色＝負責人（不變），形狀＝通路：CVS 圓、連鎖超市 方、傳統 三角、即飲 菱形、量販 維持黑框大圓。
      ②單人模式（點名字只看他）：他的店填色改成通路色（沿用儀表板 GANTT_CHANNEL_COLORS：CVS 藍、超市 青、傳統 紫、量販 鐵灰、即飲 綠），
        別人的店畫成淡灰小點當背景（不能點、不能選），地盤格子仍是他的人員顏色。
      ③通路按鈕前加同樣形狀與顏色的小圖示＝圖例，不另加畫面元素。
      形狀用 L.CircleMarker 擴充（ShapeMarker），在 canvas 上畫方形／三角形／菱形，點擊判定仍用半徑；沒有 canvas 或測試替身時退回 circleMarker（opt.shape 照記）。
  V25 產能改成數字格、上限 100%（使用者：「調整產能不如改成格子，有上下按鍵可以自行切換；數值鎖在 100%，不要有突破 100% 這種奇怪的值」）：
      ①⏱ 不再跳出輸入框，改成在該卡片下方展開「產能 [100 ▲▼] %」數字格（S.capEdit），上下鍵每格 10%，範圍 10～100（CAP_MIN／CAP_MAX／CAP_STEP）；
        改了立即重算（staffCapSet），Enter 收起、Esc 取消；再按 ⏱ 收起。
      ②上限一律 100%：新增人員的產能、舊版存過超過 100 的設定（讀取時當 100）都不能超過 100。
【定位與分工（不可違反）】
  ・儀表板＝規則來源：各通路 k（近 3 個月滾動）、主要通路判定、每月應訪次數、店家歸屬（S 列）、每人產能，全部由儀表板算好放進資料包；本工具只讀不重算。
  ・本工具＝分配引擎與操作畫面的試驗場；調整完成後，引擎（svAlloc* 一整段，與儀表板逐字元相同為目標）與畫面再接回儀表板。
  ・接回前驗證：同一份資料包，本工具與儀表板 smCmpOffice 算出的各所各方案指標必須相同（V01 以 2026/10 真實資料 56 所比對，差異 0）。
    V02 起混合制已在本工具修改，儀表板仍是 v502 版混合制；接回時把本工具引擎整段搬回儀表板，再重做一次比對。
【資料包】儀表板「🏘️ 店家分布 → 分配預覽列 → 📦 匯出分配資料包」產生 分配資料包_YYYYMM_日期.json.gz（gzip JSON）：
  format＝'sv-alloc-pack'、v＝1、ym、chanK／kInfo（各通路 k）、loadHigh／loadLow、channels（通路鍵→名稱）、
  offices[{branch,office,staff[{code,name,cap(分鐘),capDays,stores[主要通路責任店碼]}]}]、storeCols＋stores（陣列列；含非主要通路店）、excl（儀表板的排除名單）。
  v506 起 storeCols 末尾多 act、另有 actMonths（只有 V16 用過；V17 起不讀）。
  v507 起多 chanKBranch｛營業處:｛cvs,supermarket,traditional,bulk,rtd｝｝、kBranchInfo（每格 k、n 人日、raw 營業處中位數、company 全公司）、kBranchW（收縮權重）；V18 起用。
  資料包含人名員編、未去識別；要給外部請先用「原始檔案去識別化工具」處理原始檔，匯入儀表板後再匯出。
【使用者定調（分配規則，來自儀表板備忘 55 ⑦ 與 v496～v502 對話）】
  ①一次到位、不做逐月漸進 ②公平排序：通路專精 > 工作量相近 > 區域集中 > 異動少 ③非主要通路不算工作量，但每家都要有人負責
  ④「獨鳥型」店不該讓專責者跨大範圍跑（偏遠店就近交辦）⑤混合制＝通路分組：特販一組、區域型通路一組，每人只做一組、在自己區域內全包該組通路（恆春實例：A＝特販＋一小塊傳統、B＝其餘傳統）
  ⑥範圍大、人多時不論哪種制度都要有清楚邊界（遞迴二分；臺中北區實例）⑦主管可逐人排除（新人、支援等）⑧系統建議只是參考，由主管決定 ⑨主管可直接指定每人負責哪些通路（🎛 分工設定），系統只負責把店公平、有邊界地切給被指定的人
【已知限制（待使用者決定）】工作量不含路程：偏遠或狹長的所拉平工作量時，跑最遠的人可能變遠；邊界是直線，未考慮道路與行政區。
【GitHub 檢查更新】與其他四個工具同一套做法：UPD.key＝'店家分配試算工具'（須與檔名前綴相同），暫存 alloc_upd_cache、略過 alloc_skip。
-->

<script>
'use strict';
const VER='V25';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const smAttr=esc;
const smZh=(a,b)=>String(a).localeCompare(String(b),'zh-Hant');
function smHull(pts){const p=pts.slice().sort((a,b)=>a[1]-b[1]||a[0]-b[0]);if(p.length<3)return p;const cr=(o,a,b)=>(a[1]-o[1])*(b[0]-o[0])-(a[0]-o[0])*(b[1]-o[1]);const lo=[],up=[];
 p.forEach(q=>{while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)});for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}lo.pop();up.pop();return lo.concat(up)}
function smInPoly(lat,lng,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const yi=poly[i].lat,xi=poly[i].lng,yj=poly[j].lat,xj=poly[j].lng;if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside}return inside}
const SM_CMP=[['now','現況'],['geo','區域制'],['ch','通路制'],['mix','混合制'],['min','最小異動'],['cus','🎛 自訂分工'],['man','✋ 手動調整']];
const SM_CMP_NAME={now:'現況',min:'最小異動',geo:'區域制',ch:'通路制',mix:'混合制',cus:'自訂分工',man:'手動調整'};
const COLORS=['#e11d48','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5','#0d9488','#a16207','#475569','#be123c','#1d4ed8','#15803d'];
let CHANNELS={};
/* ===== 分配引擎（源自儀表板 v502 的 svAlloc*；V02 起在本工具調整，接回時整段搬回） ===== */

 if(S.map||!window.L)return;S.map=L.map('map',{preferCanvas:true,scrollWheelZoom:true});
 const prov=[['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, HERE, Garmin, FAO, NOAA, USGS'}],['https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}]];
 let pi=0,fail=0;const add=()=>{const t=L.tileLayer(prov[pi][0],prov[pi][1]).addTo(S.map);t.on('tileerror',()=>{if(++fail>=6&&pi<prov.length-1){S.map.removeLayer(t);pi++;fail=0;add()}})};add();
 S.hullLay=L.layerGroup().addTo(S.map);S.lay=L.layerGroup().addTo(S.map);S.map.setView([23.7,121],7);bindPick()}
function fitMap(){const a=curOffice();if(!S.map||!a)return;const pts=getR(a).stores.filter(s=>s.hasXY&&s.f>0).map(s=>[s.lat,s.lng]);if(pts.length)S.map.fitBounds(pts,{padding:[30,30]})}
function chOk(ch){return !S.chF.size||S.chF.has(ch)}
function visible(st){if(!st.hasXY||!chOk(st.ch))return false;if(!(st.f>0)&&!S.showNm)return false;return true}
function setMode(m){S.pick.mode=m;if(!S.map)return;const draw=m==='lasso';if(draw){S.map.dragging.disable()}else S.map.dragging.enable();const c=S.map.getContainer&&S.map.getContainer();if(c)c.style.cursor=draw?'crosshair':''}
function bindPick(){
 if(!S.map||!S.map.getContainer)return;const c=S.map.getContainer(),ll=e=>S.map.mouseEventToLatLng(e);
 c.addEventListener('pointerdown',e=>{const P=S.pick;if(P.mode!=='lasso'||e.button!==0)return;e.preventDefault();e.stopPropagation();P.drag=[ll(e)];if(P.shape){S.map.removeLayer(P.shape);P.shape=null}},true);
 c.addEventListener('pointermove',e=>{const P=S.pick;if(!P.drag)return;P.drag.push(ll(e));if(P.shape)P.shape.setLatLngs(P.drag);else P.shape=L.polyline(P.drag,{color:'#1d4ed8',weight:3,dashArray:'6 4',interactive:false}).addTo(S.map)},true);
 window.addEventListener('pointerup',()=>{const P=S.pick;if(!P.drag)return;const poly=P.drag.map(x=>({lat:x.lat,lng:x.lng}));P.drag=null;if(P.shape){S.map.removeLayer(P.shape);P.shape=null}if(poly.length>=3)lassoSel(poly)},true);}
// V22 🔒 鎖定＝引擎原本的「排除人員」（svAllocExcl，alloc-tool-excl-v1）：名下店不動、不參與系統分法與補位；手動圈選、點選、指派也避開他
function lockedStore(r,sc,code){const p=sc.owner.get(code);return !!(p&&r.ex.has(p.code))}
function lassoSel(poly){const a=curOffice();if(!a)return;const r=getR(a),sc=work(r);
 r.stores.forEach(st=>{if(st.ch==='bulk'||!visible(st)||lockedStore(r,sc,st.code))return;if(S.hl){const p=sc.owner.get(st.code);if(!p||p.code!==S.hl)return}if(smInPoly(st.lat,st.lng,poly))S.pick.sel.add(st.code)});
 renderAll()}
function renderTools(r){
 const chs=r?[...new Set(r.stores.filter(st=>st.f>0).map(st=>st.ch))]:[];[...S.chF].forEach(c=>{if(!chs.includes(c))S.chF.delete(c)});
 $('tools').innerHTML=`<button type="button" data-m=""${!S.pick.mode?' class="on"':''}>✋ 移動</button><button type="button" data-m="lasso"${S.pick.mode==='lasso'?' class="on"':''}>✎ 圈選</button><button type="button" data-m="point"${S.pick.mode==='point'?' class="on"':''}>👆 點選</button>
  <span id="chBtns" title="只看、只圈這些通路（可多選）"><button type="button" data-ch=""${!S.chF.size?' class="on"':''}>全部</button>${chs.map(c=>`<button type="button" data-ch="${c}"${S.chF.has(c)?' class="on"':''}>${chIcon(c)}${esc(lab(c))}</button>`).join('')}</span><label><input type="checkbox" id="nmChk"${S.showNm?' checked':''}>含非主要通路</label><select id="vwSel" title="業務員範圍的畫法"><option value="terr"${S.view==='terr'?' selected':''}>範圍：地盤</option><option value="hull"${S.view==='hull'?' selected':''}>範圍：色塊</option></select>${S.view==='terr'?'<span class="lg" title="這一格裡的店分屬兩個人以上（包含待分配）">虛線格＝多人重疊</span>':''}`;
 $('tools').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);renderTools(r)});
 $('chBtns').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const c=b.dataset.ch,F=S.chF;
  if(!c)F.clear();else if(!F.size)F.add(c);else if(F.has(c)){if(F.size>1)F.delete(c)}else{F.add(c);if(F.size>=chs.length)F.clear()}
  renderTools(r);renderMap()});$('nmChk').onchange=e=>{S.showNm=e.target.checked;renderMap()};$('vwSel').onchange=e=>{S.view=e.target.value;try{localStorage.setItem(VIEW_LS,S.view)}catch(x){}renderMap()};}
/* V24 通路的形狀與顏色（顏色沿用儀表板 GANTT_CHANNEL_COLORS；超市、量販取深色那一階，淺色在地圖上看不清楚）
   多人模式：填色＝負責人、形狀＝通路；單人模式：填色＝通路。通路按鈕前的小圖示＝圖例 */
const CH_SHAPE={cvs:'circle',supermarket:'square',traditional:'triangle',rtd:'diamond',bulk:'circle'};
const CH_COLOR={cvs:'#3b82f6',supermarket:'#0d9488',traditional:'#8b5cf6',bulk:'#334155',rtd:'#22c55e',other:'#6366f1'};
let ShapeMarker=null;
// 在 Leaflet 的 canvas 上畫方形／三角形／菱形（圓形照原本的 circleMarker）；點擊判定仍用半徑。沒有 canvas（或測試替身）時退回 circleMarker，opt.shape 照樣記著
function shapeMarker(ll,o){
 if(!ShapeMarker&&window.L&&L.CircleMarker&&L.CircleMarker.extend)ShapeMarker=L.CircleMarker.extend({_updatePath(){const R=this._renderer,sh=this.options.shape;
  if(!R||!R._ctx||!sh||sh==='circle')return L.CircleMarker.prototype._updatePath.call(this);if(!R._drawing||this._empty())return;
  const p=this._point,ctx=R._ctx,s=this._radius;ctx.beginPath();
  if(sh==='square')ctx.rect(p.x-s*0.95,p.y-s*0.95,s*1.9,s*1.9);
  else if(sh==='triangle'){const h=s*1.3;ctx.moveTo(p.x,p.y-h);ctx.lineTo(p.x+h,p.y+h*0.75);ctx.lineTo(p.x-h,p.y+h*0.75);ctx.closePath()}
  else{const d=s*1.35;ctx.moveTo(p.x,p.y-d);ctx.lineTo(p.x+d,p.y);ctx.lineTo(p.x,p.y+d);ctx.lineTo(p.x-d,p.y);ctx.closePath()}
  R._fillStroke(ctx,this)}});
 return ShapeMarker?new ShapeMarker(ll,o):L.circleMarker(ll,o)}
function chIcon(c){const f=CH_COLOR[c]||CH_COLOR.other,sh=CH_SHAPE[c]||'circle',
  g=sh==='square'?'<rect x="2" y="2" width="8" height="8"/>':sh==='triangle'?'<path d="M6 1.5L11 10.5H1Z"/>':sh==='diamond'?'<path d="M6 1L11 6L6 11L1 6Z"/>':'<circle cx="6" cy="6" r="4.5"/>';
 return`<svg class="chi" width="11" height="11" viewBox="0 0 12 12" fill="${f}" stroke="#fff" stroke-width="0.8">${g}</svg>`}
/* V11 地盤：六角格，每格＝最近那家主要通路店的負責人；只畫店家 TERR_BUF 公里內 */
const TERR_R=0.28,TERR_BUF=0.8,TERR_MAX=40000,TERR_HL_BUF=0.45;
// V23：buf＝畫到店家幾公里內（預設 TERR_BUF）；extra＝只拿來判斷「混合格」的別人的店（不參與塗色）
function terrCells(stores,owner,buf,extra){
 if(!stores.length)return[];
 const lat0=stores.reduce((t,s)=>t+s.lat,0)/stores.length,kx=Math.cos(lat0*Math.PI/180)*111,ky=111,B=buf||TERR_BUF;
 const P=stores.map(s=>({x:s.lng*kx,y:s.lat*ky,p:owner(s)}));
 let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;P.forEach(q=>{minx=Math.min(minx,q.x);maxx=Math.max(maxx,q.x);miny=Math.min(miny,q.y);maxy=Math.max(maxy,q.y)});
 const bk=new Map(),key=(i,j)=>i+','+j;P.forEach(q=>{const k=key(Math.floor(q.x/B),Math.floor(q.y/B));if(!bk.has(k))bk.set(k,[]);bk.get(k).push(q)});
 let r=TERR_R,cells;
 for(let tries=0;tries<6;tries++){
  const hw=Math.sqrt(3)*r,dy=1.5*r,cand=new Set();
  P.forEach(q=>{const j0=Math.floor((q.y-B-miny)/dy),j1=Math.ceil((q.y+B-miny)/dy);for(let j=j0;j<=j1;j++){const off=(j&1)?hw/2:0,i0=Math.floor((q.x-B-minx-off)/hw),i1=Math.ceil((q.x+B-minx-off)/hw);for(let i=i0;i<=i1;i++)cand.add(i+'|'+j)}});
  if(cand.size>TERR_MAX){r*=1.5;continue}
  cells=[];cand.forEach(c=>{const [i,j]=c.split('|').map(Number),y=miny+j*dy,x=minx+i*hw+((j&1)?hw/2:0),bi=Math.floor(x/B),bj=Math.floor(y/B);let best=null,bd=B*B;
   for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const l=bk.get(key(bi+a,bj+b));if(l)l.forEach(q=>{const d=(q.x-x)**2+(q.y-y)**2;if(d<bd){bd=d;best=q}})}
   if(best)cells.push({x,y,p:best.p,ps:new Set()})});
  break}
 if(!cells)return[];
 // V13 混合格：每家店歸到它所在的六角格（＝最近的格中心），一格裡有 2 個以上負責人就是混合格
 const hw=Math.sqrt(3)*r,dy=1.5*r,ix=new Map();cells.forEach(c=>{const j=Math.round((c.y-miny)/dy),i=Math.round((c.x-minx-((j&1)?hw/2:0))/hw);ix.set(i+'|'+j,c)});
 const E=(extra||[]).map(s=>({x:s.lng*kx,y:s.lat*ky,p:owner(s),ex:true}));
 P.concat(E).forEach(q=>{const j0=Math.round((q.y-miny)/dy);let best=null,bd=1e9;for(let j=j0-1;j<=j0+1;j++){const off=(j&1)?hw/2:0,i0=Math.round((q.x-minx-off)/hw);for(let i=i0-1;i<=i0+1;i++){const c=ix.get(i+'|'+j);if(!c)continue;const d=(c.x-q.x)**2+(c.y-q.y)**2;if(d<bd){bd=d;best=c}}}if(best&&(!q.ex||bd<=r*r))best.ps.add(q.p)});
 return cells.map(c=>({p:c.p,mixed:c.ps.size>=2,ring:[0,1,2,3,4,5].map(k=>{const a=(60*k+30)*Math.PI/180;return[(c.y+r*Math.sin(a))/ky,(c.x+r*Math.cos(a))/kx]})}))}
function drawTerr(r,sc,col,hlP){
 const st=r.stores.filter(s=>s.hasXY&&s.f>0&&s.ch!=='bulk'&&chOk(s.ch));
 /* V23 單人檢視：用「他自己的店」畫他完整的地盤（店家 TERR_HL_BUF 公里內），不再只畫「最近那家店剛好是他的」格子——
    他的店跟別人交錯的地方原本整片沒上色（使用者：單人檢視地盤不上色）；別人的店落在同一格＝混合格（虛線）＝跟別人重疊的地方 */
 const own=s=>sc.owner.get(s.code)||null;
 const cells=hlP?terrCells(st.filter(s=>own(s)===hlP),own,TERR_HL_BUF,st.filter(s=>own(s)!==hlP)):terrCells(st,own),by=new Map(),mix=[];
 cells.forEach(c=>{if(hlP&&c.p!==hlP)return;const k=c.p&&!c.p.removed?col.get(c.p.name):'#94a3b8';if(!by.has(k))by.set(k,[]);by.get(k).push([c.ring]);if(c.mixed)mix.push(c.ring.concat([c.ring[0]]))});
 by.forEach((rings,c)=>L.polygon(rings,{stroke:false,fillColor:c,fillOpacity:0.42,interactive:false}).addTo(S.hullLay));
 if(mix.length)L.polyline(mix,{color:'#111827',weight:1.3,opacity:0.8,dashArray:'3 3',interactive:false,mixed:true}).addTo(S.hullLay)}
function renderMap(){
 const a=curOffice(),r=a?getR(a):null;if(!$('tools'))return;renderTools(r);
 const sb=$('selbox');
 if(S.pick.sel.size&&r){const by={};const byCode=new Map(r.stores.map(x=>[x.code,x]));S.pick.sel.forEach(c=>{const st=byCode.get(c);if(st)by[lab(st.ch)]=(by[lab(st.ch)]||0)+1});
  sb.innerHTML=`已選 <b>${S.pick.sel.size}</b> 家（${Object.entries(by).map(([n,v])=>`${esc(n)} ${v}`).join('、')}）　👈 點左邊的人交給他<button type="button" id="selClr">取消</button>`;sb.style.display='block';$('selClr').onclick=()=>{S.pick.sel.clear();renderAll()}}
 else sb.style.display='none';
 if(!window.L){$('map').innerHTML='<div class="empty">地圖元件載入失敗（需要連網）。</div>';return}
 const first=!S.map;ensureMap();setMode(S.pick.mode);S.lay.clearLayers();S.hullLay.clearLayers();if(!r)return;if(first)setTimeout(()=>{S.map.invalidateSize();fitMap()},50);
 const sc=work(r),col=colorMap(r),hlP=S.hl?r.staff.find(s=>s.code===S.hl):null;
 // 每人範圍色塊（量販不畫進來）
 if(S.view==='terr')drawTerr(r,sc,col,hlP);else sc.per.forEach(x=>{if(!(x.s.cap>0)||x.s.removed)return;if(hlP&&x.s!==hlP)return;const pts=x.list.filter(st=>st.hasXY&&st.ch!=='bulk'&&chOk(st.ch)).map(st=>[st.lat,st.lng]);if(!pts.length)return;
  const c=col.get(x.s.name),h=smHull(pts),o={color:c,weight:2,fillColor:c,fillOpacity:0.1,interactive:false};(h.length>=3?L.polygon(h,o):h.length===2?L.polyline(h,{color:c,weight:3,interactive:false}):L.circle(h[0],Object.assign({radius:150},o))).addTo(S.hullLay)});
 /* V24 單人檢視：別人的店畫成淡灰小點當背景（不能點、不能選），他的店畫在上面 */
 const ordered=hlP?r.stores.filter(st=>sc.owner.get(st.code)!==hlP).concat(r.stores.filter(st=>sc.owner.get(st.code)===hlP)):r.stores;
 ordered.forEach(st=>{if(!visible(st))return;const p=sc.owner.get(st.code),shape=CH_SHAPE[st.ch]||'circle';
  if(hlP&&p!==hlP){shapeMarker([st.lat,st.lng],{shape,radius:st.ch==='bulk'?5:3,color:'#fff',weight:0.5,fillColor:'#9ca3af',fillOpacity:0.55,interactive:false}).addTo(S.lay);return}
  const bk=st.ch==='bulk',sel=S.pick.sel.has(st.code),main=st.f>0,c=hlP?(CH_COLOR[st.ch]||CH_COLOR.other):(p&&!p.removed?col.get(p.name):'#94a3b8'); /* V24：多人＝填色是人、形狀是通路；單人＝填色改成通路 */
  const mk=shapeMarker([st.lat,st.lng],{shape,radius:bk?8:main?5:3,color:sel?'#1d4ed8':bk?'#111827':'#fff',weight:sel?3.5:bk?3:1,dashArray:bk?'3 2':null,fillColor:c,fillOpacity:main?0.9:0.5});
  mk.on('click',()=>{if(S.pick.mode==='point'){mk.closePopup&&mk.closePopup();if(lockedStore(r,sc,st.code))return;if(S.pick.sel.has(st.code))S.pick.sel.delete(st.code);else S.pick.sel.add(st.code);renderAll()}});
  if(S.pick.mode!=='point')mk.bindPopup(`<b>${esc(st.name)}</b>${bk?'（量販）':''}<br>${esc(lab(st.ch))}・${esc(st.type)}・${esc(st.level)}<br>負責人：${esc(p?p.name+(p.removed?'（已調離，待分配）':''):'—')}`);
  mk.addTo(S.lay)});
}
/* ---------- GitHub 檢查更新（與其他四個工具同一套做法） ---------- */
const VERN=+String(VER).replace(/\D/g,'');
const UPD={raw:'https://raw.githubusercontent.com/1061005ttl-lab/tool/main/',api:'https://api.github.com/repos/1061005ttl-lab/tool/contents/',key:'店家分配試算工具',min:10};
const upKey=t=>String(t).replace(/[\s　_\-]/g,'').toLowerCase();
const upParse=n=>{const m=String(n).match(/^(.+?)[v]0*(\d+)\.html?$/i);return m?{base:upKey(m[1]),ver:Number(m[2])}:null};
async function checkUpdate(force){
 if(!window.fetch){if(force)alert('此瀏覽器不支援檢查更新');return}
 const btn=$('ubtn'),old=btn.textContent;if(force){btn.disabled=true;btn.textContent='查詢中⋯'}
 const done=m=>{if(force){btn.disabled=false;btn.textContent=m||old;if(m)setTimeout(()=>btn.textContent=old,2500)}};
 try{
  let best=null;const now=Date.now(),CK='alloc_upd_cache';
  try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(!force&&c&&now-c.t<UPD.min*6e4)best=c.best||{ver:0}}catch(e){}
  if(!best){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),6000);
   const r=await fetch(UPD.api,{signal:ac.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(tm);
   if(!r.ok){done(force?'查詢失敗（'+r.status+'）':'');if(force)alert('查詢失敗（'+r.status+'），可能是查詢次數用完，請稍後再試');return}
   const list=await r.json();if(!Array.isArray(list)){done();return}best={ver:0};
   for(const f of list){if(f.type!=='file')continue;const p=upParse(f.name);if(p&&p.base===upKey(UPD.key)&&p.ver>best.ver)best={ver:p.ver,name:f.name,url:f.html_url,dl:f.download_url}}
   try{localStorage.setItem(CK,JSON.stringify({t:now,best}))}catch(e){}}
  const nv=best.ver;if(!(nv>VERN)){done(force?'已是最新版 '+VER:'');return}
  let sk=0;try{sk=Number(localStorage.getItem('alloc_skip'))||0}catch(e){}if(!force&&sk>=nv){done();return}
  const u=$('upd');u.innerHTML=`<span class="t">🔔 有新版 <b>V${nv}</b>（目前 ${VER}）：${esc(best.name||'')}<br><span id="updMsg">按「直接下載」會把新版存到下載資料夾，再關掉這個頁面、改開新下載的檔案即可。</span></span><button class="p" id="updGo">直接下載</button><button id="updSkip">略過此版</button><button id="updLater">稍後再說</button>`;
  u.classList.add('on');done();
  $('updGo').onclick=async e=>{const b=e.currentTarget,m=$('updMsg');try{b.disabled=true;b.textContent='下載中…';const r=await fetch(best.dl||(UPD.raw+encodeURIComponent(best.name)),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const bl=new Blob([await r.blob()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=best.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    b.textContent='已下載 ✓';m.textContent='已存到下載資料夾：'+best.name+'。請關掉這個頁面，改開新下載的檔案。'}catch(err){b.disabled=false;b.textContent='重試';m.textContent='下載失敗（可能是網路不穩，或公司網路擋住 GitHub），請稍後按「重試」。'}};
  $('updSkip').onclick=()=>{try{localStorage.setItem('alloc_skip',String(nv))}catch(e){}u.classList.remove('on')};$('updLater').onclick=()=>u.classList.remove('on');
 }catch(e){done(force?'查不到更新':'');if(force)alert('查不到更新（可能離線，或公司網路擋住 GitHub）')}}
$('ubtn').onclick=()=>checkUpdate(true);setTimeout(()=>checkUpdate(),1200);
</script></body></html>
