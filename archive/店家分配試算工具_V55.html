      ①rzCur／rzCurOwn：每個原營業所用它現在的所內分配（手動換店、放到待分配、起點、量販指定、業務投入、調離、新人），取代資料包原本的負責人；

        說明框、比較基準框拿掉；💡 框只在有建議時出現一顆「🪄 套用系統建議」；「兩所所址一樣」這種要處理的事才常駐。

      修完：南門（併東區）新所「沒有負責人」272 → 2 家，跟原南門所一致。
      ③（使用者同版加開）「還沒人負責」框的家數分開寫「主要通路 N 家（紅、粗體）、非主要 N 家」；沒有店的「他所移入」那一行不列。

      ①「⇄ 改成異地分兩所」後若兩所據點一樣，直接進入「點地圖標據點」（S.rzSiteFor＝搬出去那一所），左側一行藍色指引＋地圖上方提示，可取消。
      ②配對異地時，在地圖上標好據點（含之後按 📍 重標）→ 自動依據點重切，提示列寫兩所各幾家主要通路店；同一步，↶ 一次全部回去。一般重劃不自動切（主管手畫的區不蓋掉）。
      ③① 範圍卡片上的 📍 常駐（原本滑鼠移上去才出現）。

【定位與分工（不可違反）】
  ・儀表板＝規則來源：各通路 k（近 3 個月滾動）、主要通路判定、每月應訪次數、店家歸屬（S 列）、每人產能，全部由儀表板算好放進資料包；本工具只讀不重算。
  ・本工具＝分配引擎與操作畫面的試驗場；調整完成後，引擎（svAlloc* 一整段，與儀表板逐字元相同為目標）與畫面再接回儀表板。
  ・接回前驗證：同一份資料包，本工具與儀表板 smCmpOffice 算出的各所各方案指標必須相同（V01 以 2026/10 真實資料 56 所比對，差異 0）。
    V02 起混合制已在本工具修改，儀表板仍是 v502 版混合制；接回時把本工具引擎整段搬回儀表板，再重做一次比對。
【資料包】儀表板「🏘️ 店家分布 → 分配預覽列 → 📦 匯出分配資料包」產生 分配資料包_YYYYMM_日期.json.gz（gzip JSON）：
  format＝'sv-alloc-pack'、v＝1、ym、chanK／kInfo（各通路 k）、loadHigh／loadLow、channels（通路鍵→名稱）、
  offices[{branch,office,staff[{code,name,cap(分鐘),capDays,stores[主要通路責任店碼]}]}]、storeCols＋stores（陣列列；含非主要通路店）、excl（儀表板的排除名單）。
  v506 起 storeCols 末尾多 act、另有 actMonths（只有 V16 用過；V17 起不讀）。
  v507 起多 chanKBranch｛營業處:｛cvs,supermarket,traditional,bulk,rtd｝｝、kBranchInfo（每格 k、n 人日、raw 營業處中位數、company 全公司）、kBranchW（收縮權重）；V18 起用。
  資料包含人名員編、未去識別；要給外部請先用「原始檔案去識別化工具」處理原始檔，匯入儀表板後再匯出。
【使用者定調（分配規則，來自儀表板備忘 55 ⑦ 與 v496～v502 對話）】
  ①一次到位、不做逐月漸進 ②公平排序：通路專精 > 工作量相近 > 區域集中 > 異動少 ③非主要通路不算工作量，但每家都要有人負責
  ④「獨鳥型」店不該讓專責者跨大範圍跑（偏遠店就近交辦）⑤混合制＝通路分組：特販一組、區域型通路一組，每人只做一組、在自己區域內全包該組通路（恆春實例：A＝特販＋一小塊傳統、B＝其餘傳統）
  ⑥範圍大、人多時不論哪種制度都要有清楚邊界（遞迴二分；臺中北區實例）⑦主管可逐人排除（新人、支援等）⑧系統建議只是參考，由主管決定 ⑨主管可直接指定每人負責哪些通路（🎛 分工設定），系統只負責把店公平、有邊界地切給被指定的人
【已知限制（待使用者決定）】工作量不含路程：偏遠或狹長的所拉平工作量時，跑最遠的人可能變遠；邊界是直線，未考慮道路與行政區。
【GitHub 檢查更新】與其他四個工具同一套做法：UPD.key＝'店家分配試算工具'（須與檔名前綴相同），暫存 alloc_upd_cache、略過 alloc_skip。

/* ---------- GitHub 檢查更新（與其他四個工具同一套做法） ---------- */
const VERN=+String(VER).replace(/\D/g,'');
const UPD={raw:'https://raw.githubusercontent.com/1061005ttl-lab/tool/main/',api:'https://api.github.com/repos/1061005ttl-lab/tool/contents/',key:'店家分配試算工具',min:10};
const upKey=t=>String(t).replace(/[\s　_\-]/g,'').toLowerCase();
const upParse=n=>{const m=String(n).match(/^(.+?)[v]0*(\d+)\.html?$/i);return m?{base:upKey(m[1]),ver:Number(m[2])}:null};
async function checkUpdate(force){
 if(!window.fetch){if(force)alert('此瀏覽器不支援檢查更新');return}
 const btn=$('ubtn'),old=btn.textContent;if(force){btn.disabled=true;btn.textContent='查詢中⋯'}
 const done=m=>{if(force){btn.disabled=false;btn.textContent=m||old;if(m)setTimeout(()=>btn.textContent=old,2500)}};
 try{
  let best=null;const now=Date.now(),CK='alloc_upd_cache';
  try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(!force&&c&&now-c.t<UPD.min*6e4)best=c.best||{ver:0}}catch(e){}
  if(!best){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),6000);
   const r=await fetch(UPD.api,{signal:ac.signal,headers:{Accept:'application/vnd.github+json'}});clearTimeout(tm);
   if(!r.ok){done(force?'查詢失敗（'+r.status+'）':'');if(force)alert('查詢失敗（'+r.status+'），可能是查詢次數用完，請稍後再試');return}
   const list=await r.json();if(!Array.isArray(list)){done();return}best={ver:0};
   for(const f of list){if(f.type!=='file')continue;const p=upParse(f.name);if(p&&p.base===upKey(UPD.key)&&p.ver>best.ver)best={ver:p.ver,name:f.name,url:f.html_url,dl:f.download_url}}
   try{localStorage.setItem(CK,JSON.stringify({t:now,best}))}catch(e){}}
  const nv=best.ver;if(!(nv>VERN)){done(force?'已是最新版 '+VER:'');return}
  let sk=0;try{sk=Number(localStorage.getItem('alloc_skip'))||0}catch(e){}if(!force&&sk>=nv){done();return}
  const u=$('upd');u.innerHTML=`<span class="t">🔔 有新版 <b>V${nv}</b>（目前 ${VER}）：${esc(best.name||'')}<br><span id="updMsg">按「直接下載」會把新版存到下載資料夾，再關掉這個頁面、改開新下載的檔案即可。</span></span><button class="p" id="updGo">直接下載</button><button id="updSkip">略過此版</button><button id="updLater">稍後再說</button>`;
  u.classList.add('on');done();
  $('updGo').onclick=async e=>{const b=e.currentTarget,m=$('updMsg');try{b.disabled=true;b.textContent='下載中…';const r=await fetch(best.dl||(UPD.raw+encodeURIComponent(best.name)),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const bl=new Blob([await r.blob()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=best.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    b.textContent='已下載 ✓';m.textContent='已存到下載資料夾：'+best.name+'。請關掉這個頁面，改開新下載的檔案。'}catch(err){b.disabled=false;b.textContent='重試';m.textContent='下載失敗（可能是網路不穩，或公司網路擋住 GitHub），請稍後按「重試」。'}};
  $('updSkip').onclick=()=>{try{localStorage.setItem('alloc_skip',String(nv))}catch(e){}u.classList.remove('on')};$('updLater').onclick=()=>u.classList.remove('on');
 }catch(e){done(force?'查不到更新':'');if(force)alert('查不到更新（可能離線，或公司網路擋住 GitHub）')}}
renderPlanSel();
$('ubtn').onclick=()=>checkUpdate(true);setTimeout(()=>checkUpdate(),1200);
</script></body></html>
